name: Simplify add point

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize map-only point flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove any accidental duplicate selectedAddress assignment before its declaration.
          s = s.replace('  selectedAddress = "";\nlet selectedAddress = "";', 'let selectedAddress = "";')

          # Remove newAddress from clearForm and clear the metadata address there.
          s = s.replace('    "newAddress",\n', '')
          if 'function clearForm(){' in s:
              a, b = s.split('function clearForm(){', 1)
              if '/* =====================================================\n   SEARCH ADDRESS' in b:
                  c, d = b.split('/* =====================================================\n   SEARCH ADDRESS', 1)
                  c = c.replace('  selectedLng = null;', '  selectedLng = null;\n\n  selectedAddress = "";', 1)
                  s = a + 'function clearForm(){' + c + '/* =====================================================\n   SEARCH ADDRESS' + d

          # There must be no manual address-search function or autocomplete.
          if 'function searchAddress(){' in s:
              a = s.index('function searchAddress(){')
              b = s.index('/* =====================================================\n   PICK MAP POINT', a)
              s = s[:a] + s[b:]
          s = re.sub(r'\n<style id="ADDRESS_AUTOCOMPLETE_[^"]+">.*?</style>\s*', '\n', s, flags=re.S)
          s = re.sub(r'\n<script id="ADDRESS_AUTOCOMPLETE_[^"]+">.*?</script>\s*', '\n', s, flags=re.S)
          s = s.replace('&libraries=geometry,places', '&libraries=geometry')

          # Remove obsolete address result CSS if any remains.
          s = re.sub(r'\n\.address-results\{.*?\n\}\n\n\.address-result\{.*?\n\}\n', '\n', s, count=1, flags=re.S)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Finalize map-only address flow"
            git push
          fi

# final trigger