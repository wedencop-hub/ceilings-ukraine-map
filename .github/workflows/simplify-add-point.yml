name: Simplify add point

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove manual address input and use map coordinates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'\n?\s*<div[^>]*class="group"[^>]*>\s*<label[^>]*class="label"[^>]*>\s*Адреса\s*</label>\s*<input[^>]*id="newAddress"[^>]*>\s*</div>', '', s, count=1, flags=re.S)
          if s2 == s:
              s2 = re.sub(r'\n?\s*<label[^>]*class="label"[^>]*>\s*Адреса\s*</label>\s*<input[^>]*id="newAddress"[^>]*>\s*', '', s, count=1, flags=re.S)
          s = s2
          if 'let selectedAddress = "";' not in s:
              s = s.replace('let selectedLng = null;', 'let selectedLng = null;\nlet selectedAddress = "";', 1)
          s = re.sub(r'address:\s*document\s*\.getElementById\(\s*"newAddress"\s*\)\s*\.value\s*\.trim\(\),', 'address: selectedAddress || "",', s, count=1, flags=re.S)
          s = re.sub(r'\n?\s*document\s*\.getElementById\(\s*"newAddress"\s*\)\s*\.value\s*=\s*currentPlace\.address\s*\|\|\s*""\s*;', '\n  selectedAddress = currentPlace.address || "";', s, count=1, flags=re.S)
          s = s.replace('selectedLng = null;\n', 'selectedLng = null;\n  selectedAddress = "";\n', 1)
          s = re.sub(r'\s*const input=document\.getElementById\("newAddress"\);\s*if\(input\) input\.value=results\[0\]\.formatted_address;\s*const box=document\.getElementById\("addressResults"\);\s*if\(box\) box\.innerHTML="";', '\n    selectedAddress = results[0].formatted_address || "";', s, count=1)
          s = re.sub(r'\nfunction searchAddress\(\)\{.*?\n\}\n\nfunction ', '\nfunction ', s, count=1, flags=re.S)
          s = re.sub(r'\n<script id="ADDRESS_AUTOCOMPLETE_[^"]+">.*?</script>\s*', '\n', s, flags=re.S)
          s = re.sub(r'\n?\s*<div[^>]*id="addressResults"[^>]*>.*?</div>', '', s, flags=re.S)
          marker = '<!-- ADD_POINT_MAP_ONLY_V1 -->'
          if marker not in s:
              s = s.replace('</head>', '<style>\n/* ADD_POINT_MAP_ONLY_V1 */\n</style>\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use map point as address source"
            git push
          fi

# trigger patch