name: Fix map runtime
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-map-runtime.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          # Remove the satellite button completely.
          s = re.sub(
              r'\n\s*<button\s+id="mapTypeButton".*?</button>\s*',
              '\n',
              s,
              count=1,
              flags=re.S,
          )

          # Do not reference google.maps.OverlayView at script parse time.
          # Telegram can load this page before Google Maps has created window.google.
          old = re.search(
              r'class LogoRatingOverlay extends google\.maps\.OverlayView\{.*?\n\}\n\n\nfunction renderMarkers',
              s,
              flags=re.S,
          )
          if not old:
              raise SystemExit('LogoRatingOverlay block not found')

          new = '''class LogoRatingOverlay{
  constructor(position,place,clickHandler){
    this.position=position;
    this.place=place;
    this.clickHandler=clickHandler;
    this.div=null;
    this.overlay=new google.maps.OverlayView();
    const self=this;

    this.overlay.onAdd=function(){
      const div=document.createElement("div");
      div.className="custom-map-marker";
      div.setAttribute("role","button");
      div.setAttribute("aria-label",self.place.name||"Точка");
      const logo=self.place.logo_url
        ? `<img class="marker-logo" src="${escapeAttribute(self.place.logo_url)}" alt="">`
        : `<div class="marker-logo-fallback">🏠</div>`;
      const rating=Number(self.place.rating||0);
      const ratingText=rating>0?rating.toFixed(1):"—";
      div.innerHTML=logo+`<span class="marker-rating-text"><span class="marker-star">★</span>${ratingText}</span>`;
      div.addEventListener("click",self.clickHandler);
      div.addEventListener("touchend",event=>{event.preventDefault();self.clickHandler(event);},{passive:false});
      self.div=div;
      self.overlay.getPanes().overlayMouseTarget.appendChild(div);
    };

    this.overlay.draw=function(){
      if(!self.div)return;
      const projection=self.overlay.getProjection();
      const point=projection.fromLatLngToDivPixel(self.position);
      if(!point)return;
      self.div.style.left=point.x+"px";
      self.div.style.top=point.y+"px";
    };

    this.overlay.onRemove=function(){
      if(self.div){self.div.remove();self.div=null;}
    };
  }

  setMap(value){
    this.overlay.setMap(value);
  }
}


function renderMarkers'''
          s = s[:old.start()] + new + s[old.end():]

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix map runtime and remove satellite control" || exit 0
          git push
