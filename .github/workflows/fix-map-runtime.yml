name: Fix map runtime
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-map-runtime.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          # Remove the satellite button completely.
          s = re.sub(
              r'\n\s*<button\s+id="mapTypeButton".*?</button>\s*',
              '\n',
              s,
              count=1,
              flags=re.S,
          )

          # The custom marker class was extending google.maps.OverlayView before
          # the Google Maps script had loaded. That can stop the whole JS program.
          # Use an internal OverlayView instance instead, created only after Maps loads.
          old = re.search(
              r'class LogoRatingOverlay extends google\\.maps\\.OverlayView\\{.*?\n\\}\\n\\n\\nfunction renderMarkers',
              s,
              flags=re.S,
          )
          if not old:
              raise SystemExit('LogoRatingOverlay block not found')

          new = '''class LogoRatingOverlay{\n  constructor(position,place,clickHandler){\n    this.position=position;\n    this.place=place;\n    this.clickHandler=clickHandler;\n    this.div=null;\n    this.overlay=new google.maps.OverlayView();\n    const self=this;\n\n    this.overlay.onAdd=function(){\n      const div=document.createElement("div");\n      div.className="custom-map-marker";\n      div.setAttribute("role","button");\n      div.setAttribute("aria-label",self.place.name||"Точка");\n      const logo=self.place.logo_url\n        ? `<img class="marker-logo" src="${escapeAttribute(self.place.logo_url)}" alt="">`\n        : `<div class="marker-logo-fallback">🏠</div>`;\n      const rating=Number(self.place.rating||0);\n      const ratingText=rating>0?rating.toFixed(1):"—";\n      div.innerHTML=logo+`<span class="marker-rating-text"><span class="marker-star">★</span>${ratingText}</span>`;\n      div.addEventListener("click",self.clickHandler);\n      div.addEventListener("touchend",event=>{event.preventDefault();self.clickHandler(event);},{passive:false});\n      self.div=div;\n      self.overlay.getPanes().overlayMouseTarget.appendChild(div);\n    };\n\n    this.overlay.draw=function(){\n      if(!self.div)return;\n      const projection=self.overlay.getProjection();\n      const point=projection.fromLatLngToDivPixel(self.position);\n      if(!point)return;\n      self.div.style.left=point.x+"px";\n      self.div.style.top=point.y+"px";\n    };\n\n    this.overlay.onRemove=function(){\n      if(self.div){self.div.remove();self.div=null;}\n    };\n  }\n\n  setMap(value){\n    this.overlay.setMap(value);\n  }\n}\n\n\nfunction renderMarkers'''
          s = s[:old.start()] + new + s[old.end():]

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix map runtime and remove satellite control" || exit 0
          git push
