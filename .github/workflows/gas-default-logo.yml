name: Add automatic gas logo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply gas marker and filter fixes
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove Instrument as a map filter only.
          s = re.sub(r'\n\s*<button\s+class="category"\s+data-cat="tools">.*?</button>\s*', '\n', s, count=1, flags=re.S)

          # Gas points always use the flame marker on the map.
          old_marker = '''      const logo=self.place.logo_url\n        ? `<img class="marker-logo" src="${escapeAttribute(self.place.logo_url)}" alt="">`\n        : `<div class="marker-logo-fallback">+</div>`;\n'''
          new_marker = '''      const category=String(self.place.category||"");\n      const isGas=category==="gas";\n      const logo=isGas\n        ? `<div class="marker-logo-fallback gas-marker-logo">🔥</div>`\n        : self.place.logo_url\n          ? `<img class="marker-logo" src="${escapeAttribute(self.place.logo_url)}" alt="">`\n          : `<div class="marker-logo-fallback">+</div>`;\n'''
          if old_marker in s:
              s = s.replace(old_marker, new_marker, 1)

          # Add dedicated styling for the flame badge.
          if '.gas-marker-logo{' not in s:
              css = '''.custom-map-marker .gas-marker-logo{\n  background:#fff3e0;\n  color:#ff6d00;\n  font-size:21px;\n}\n'''
              pos = s.find('/* =========================\n   TOP')
              if pos >= 0:
                  s = s[:pos] + css + '\n' + s[pos:]
              else:
                  s = s.replace('</style>', css + '</style>', 1)

          # Keep automatic flame logo for newly added gas points when no photo is supplied.
          old_save = '''  if(file){\n\n    const prepared =\n      await prepareImageFile(file);\n\n    place.logo_data =\n      prepared.data;\n\n    place.logo_type =\n      "image/jpeg";\n\n  }'''
          new_save = '''  if(file){\n\n    const prepared =\n      await prepareImageFile(file);\n\n    place.logo_data =\n      prepared.data;\n\n    place.logo_type =\n      "image/jpeg";\n\n  }else if(place.category === "gas"){\n\n    // GAS_DEFAULT_LOGO_V1: automatic default icon for gas points.\n    place.logo_data =\n      "data:image/svg+xml;charset=UTF-8," +\n      encodeURIComponent(`\n        <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">\n          <rect width="256" height="256" rx="64" fill="#ffffff"/>\n          <text x="128" y="174" text-anchor="middle" font-size="150">🔥</text>\n        </svg>\n      `);\n    place.logo_type =\n      "image/svg+xml";\n\n  }'''
          if old_save in s and 'GAS_DEFAULT_LOGO_V1' not in s:
              s = s.replace(old_save, new_save, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show flame marker for gas points and remove tools filter"
          git pull --rebase origin main
          git push
