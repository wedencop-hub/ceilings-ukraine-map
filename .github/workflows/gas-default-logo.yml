name: Add automatic gas logo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set gas icon as default logo
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'GAS_DEFAULT_LOGO_V1'
          if marker in s:
              raise SystemExit(0)

          old = '''  if(file){\n\n    const prepared =\n      await prepareImageFile(file);\n\n    place.logo_data =\n      prepared.data;\n\n    place.logo_type =\n      "image/jpeg";\n\n  }'''

          new = '''  if(file){\n\n    const prepared =\n      await prepareImageFile(file);\n\n    place.logo_data =\n      prepared.data;\n\n    place.logo_type =\n      "image/jpeg";\n\n  }else if(place.category === "gas"){\n\n    // GAS_DEFAULT_LOGO_V1: automatic default icon for gas points.\n    place.logo_data =\n      "data:image/svg+xml;charset=UTF-8," +\n      encodeURIComponent(`\n        <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">\n          <rect width="256" height="256" rx="64" fill="#ffffff"/>\n          <text x="128" y="174" text-anchor="middle" font-size="150">🔥</text>\n        </svg>\n      `);\n    place.logo_type =\n      "image/svg+xml";\n\n  }'''

          if old not in s:
              raise SystemExit('target block not found')

          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use fire icon for gas points"
          git push
