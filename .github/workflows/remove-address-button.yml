name: Remove address search button

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fix add form after address removal
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          old = '''  document
    .getElementById(
      "addressResults"
    )
    .innerHTML =
      "";'''
          new = '''  const addressResults =
    document.getElementById("addressResults");
  if(addressResults){
    addressResults.innerHTML = "";
  }'''
          if old in s:
              s = s.replace(old, new, 1)

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('Fixed clearForm addressResults crash')
          else:
              print('No changes needed')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Guard removed address results element"
          git push
