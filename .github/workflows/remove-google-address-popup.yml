name: Remove Google address popup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove Google geocoder autocomplete
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the V3 Google Geocoder autocomplete that triggers
          # Google's "Unable to load Google Maps on this page" alert
          # inside Telegram iOS WebView.
          s2 = re.sub(r'<style id="ADDRESS_AUTOCOMPLETE_V3_STYLE">.*?</style>\s*', '', s, flags=re.S)
          s2 = re.sub(r'<script id="ADDRESS_AUTOCOMPLETE_V3">.*?</script>\s*', '', s2, flags=re.S)

          # Remove any remaining manual address-search button by its text.
          s2 = re.sub(r'<button([^>]*?)>\s*🔎\s*Знайти адресу\s*</button>', '', s2, flags=re.S|re.I)

          if s2 == s:
              print('No Google address popup code found; nothing to change')
              raise SystemExit(0)

          p.write_text(s2, encoding='utf-8')
          print('Removed Google address autocomplete/geocoder popup code')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Remove Google address popup from Telegram WebView"
          git push
