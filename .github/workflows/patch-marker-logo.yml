name: Patch map marker
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'marker-logo') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch marker
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '''.marker-rating{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;

  min-width:58px;
  height:34px;

  padding:0 10px;

  background:#fff;
  color:#111;

  border:2px solid rgba(0,0,0,.15);
  border-radius:20px;

  box-shadow:0 4px 14px rgba(0,0,0,.4);

  font-size:13px;
  font-weight:800;

  white-space:nowrap;
}

.marker-rating .star{
  color:#f5b900;
  font-size:15px;
}'''

          new_css = '''.marker-rating{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-width:76px;
  height:38px;
  padding:3px 8px 3px 4px;
  background:#fff;
  color:#111;
  border:2px solid rgba(0,0,0,.15);
  border-radius:20px;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}

.marker-rating .logo{
  width:30px;
  height:30px;
  border-radius:50%;
  object-fit:cover;
  background:#eef2f5;
  border:1px solid rgba(0,0,0,.12);
}

.marker-rating .star{
  color:#f5b900;
  font-size:15px;
}'''
          if old_css in s:
              s = s.replace(old_css, new_css, 1)

          old = '''      const marker =
        new google.maps.Marker(
          {
            position:{
              lat,
              lng
            },

            map,

            title:
              place.name ||
              "",

            label:{
              text:
                rating > 0
                  ? "★ " +
                    rating.toFixed(1)
                  : "★ —",

              color:"#111",

              fontWeight:"800",

              fontSize:"13px"
            }
          }
        );'''

          new = '''      const markerLabel =
        rating > 0
          ? rating.toFixed(1)
          : "—";

      const logoUrl =
        String(place.logo_url || "").trim();

      const markerIcon =
        logoUrl
          ? {
              url:
                "data:image/svg+xml;charset=UTF-8," +
                encodeURIComponent(`
                  <svg xmlns="http://www.w3.org/2000/svg" width="92" height="46" viewBox="0 0 92 46">
                    <rect x="1" y="1" width="90" height="44" rx="22" fill="white" stroke="#d6d6d6" stroke-width="2"/>
                    <defs>
                      <clipPath id="c"><circle cx="23" cy="23" r="16"/></clipPath>
                    </defs>
                    <circle cx="23" cy="23" r="16" fill="#eef2f5"/>
                    <image href="${escapeAttribute(logoUrl)}" x="7" y="7" width="32" height="32" preserveAspectRatio="xMidYMid slice" clip-path="url(#c)"/>
                    <text x="44" y="29" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111">★ ${markerLabel}</text>
                  </svg>
                `),
              scaledSize:new google.maps.Size(92,46),
              anchor:new google.maps.Point(46,23)
            }
          : undefined;

      const marker =
        new google.maps.Marker(
          {
            position:{
              lat,
              lng
            },
            map,
            title:
              place.name ||
              "",
            icon:markerIcon,
            label:
              logoUrl
                ? undefined
                : {
                    text:"★ " + markerLabel,
                    color:"#111",
                    fontWeight:"800",
                    fontSize:"13px"
                  }
          }
        );'''

          if old not in s:
              raise SystemExit('marker block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit marker update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add logo to map rating markers marker-logo"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/patch-marker-logo.yml
          git commit -m "Remove temporary marker patch workflow marker-logo"
          git push

# trigger marker-logo patch
