name: Add Google-style address autocomplete

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch address autocomplete
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'ADDRESS_AUTOCOMPLETE_V3' in s:
              print('Autocomplete V3 already installed')
              raise SystemExit(0)

          style = r'''
          <style id="ADDRESS_AUTOCOMPLETE_V3_STYLE">
          #addressSuggestV3{
            position:absolute;
            left:0;
            right:0;
            top:calc(100% + 6px);
            z-index:100000;
            display:none;
            max-height:280px;
            overflow:auto;
            background:#101923;
            border:1px solid rgba(255,255,255,.16);
            border-radius:12px;
            box-shadow:0 10px 30px rgba(0,0,0,.5);
          }
          #addressSuggestV3.show{display:block}
          .address-suggest-v3-item{
            display:block;
            width:100%;
            padding:13px 14px;
            border:0;
            border-bottom:1px solid rgba(255,255,255,.08);
            background:#101923;
            color:#fff;
            text-align:left;
            font-size:14px;
            line-height:1.35;
          }
          .address-suggest-v3-item:last-child{border-bottom:0}
          .address-suggest-v3-item:active{background:#1d2b38}
          .address-suggest-v3-main{font-weight:800}
          .address-suggest-v3-sub{margin-top:3px;color:#9eabb7;font-size:12px}
          #addModal .address-field-wrap{position:relative}
          </style>
          '''
          if 'ADDRESS_AUTOCOMPLETE_V3_STYLE' not in s:
              s = s.replace('</head>', style + '\n</head>', 1)

          script = r'''
          <script id="ADDRESS_AUTOCOMPLETE_V3">
          (function(){
            let timer=null;
            let geocoder=null;
            let lastQuery='';
            let results=[];

            function install(){
              const input=document.getElementById('newAddress');
              if(!input || !window.google || !google.maps || !google.maps.Geocoder) return false;
              if(input.dataset.addressAutocompleteV3==='1') return true;

              const parent=input.parentElement;
              if(parent) parent.classList.add('address-field-wrap');

              let box=document.getElementById('addressSuggestV3');
              if(!box && parent){
                box=document.createElement('div');
                box.id='addressSuggestV3';
                parent.appendChild(box);
              }
              if(!box) return false;

              geocoder=new google.maps.Geocoder();
              input.setAttribute('autocomplete','off');

              function hide(){
                box.classList.remove('show');
                box.innerHTML='';
              }

              function choose(index){
                const r=results[index];
                if(!r || !r.geometry || !r.geometry.location) return;
                input.value=r.formatted_address || input.value;
                selectedLat=r.geometry.location.lat();
                selectedLng=r.geometry.location.lng();
                hide();
              }

              function render(list){
                results=list.slice(0,6);
                box.innerHTML='';
                results.forEach(function(r,i){
                  const b=document.createElement('button');
                  b.type='button';
                  b.className='address-suggest-v3-item';
                  const parts=(r.formatted_address||'').split(',');
                  const main=parts.shift()||r.formatted_address||'';
                  const sub=parts.join(',').trim();
                  b.innerHTML='<div class="address-suggest-v3-main"></div>'+(sub?'<div class="address-suggest-v3-sub"></div>':'');
                  b.querySelector('.address-suggest-v3-main').textContent=main;
                  if(sub) b.querySelector('.address-suggest-v3-sub').textContent=sub;
                  b.addEventListener('pointerdown',function(e){e.preventDefault(); choose(i);});
                  box.appendChild(b);
                });
                if(results.length) box.classList.add('show'); else hide();
              }

              input.addEventListener('input',function(){
                const q=input.value.trim();
                clearTimeout(timer);
                if(q.length<3){hide();return;}
                if(q===lastQuery) return;
                lastQuery=q;
                timer=setTimeout(function(){
                  geocoder.geocode({
                    address:q,
                    componentRestrictions:{country:'UA'},
                    language:'uk',
                    region:'UA'
                  },function(res,status){
                    if(input.value.trim()!==q) return;
                    if(status==='OK' && res && res.length) render(res);
                    else hide();
                  });
                },450);
              });

              input.addEventListener('focus',function(){
                if(input.value.trim().length>=3 && results.length) box.classList.add('show');
              });
              document.addEventListener('pointerdown',function(e){
                if(!parent || !parent.contains(e.target)) hide();
              });

              input.dataset.addressAutocompleteV3='1';
              return true;
            }

            function wait(){
              if(!install()) setTimeout(wait,300);
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',wait);
            else wait();
            setTimeout(wait,1000);
          })();
          </script>
          '''
          s = s.replace('</body>', script + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('Google-style address fallback autocomplete V3 installed')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix address autocomplete on mobile WebView"
          git push
