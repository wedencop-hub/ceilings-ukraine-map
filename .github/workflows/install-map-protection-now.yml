name: Install map protection now
on:
  push:
    paths:
      - '.github/workflows/install-map-protection-now.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protection before app scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="map-protection.js?v=2"></script>'
          # Remove older protection tags if any, then install exactly once before </head>.
          import re
          s = re.sub(r'<script src="map-protection\.js\?v=[^"]+"></script>\s*', '', s)
          if '</head>' not in s:
              raise SystemExit('index.html has no </head>')
          s = s.replace('</head>', tag + '\n</head>', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Install map startup protection v2'
          git push
