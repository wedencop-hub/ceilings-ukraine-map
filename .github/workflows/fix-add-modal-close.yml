name: Fix add modal close button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update add-point modal close control
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_box = '''.modal-box{\n  width:100%;'''
          new_box = '''.modal-box{\n  position:relative;\n\n  width:100%;'''
          if old_box not in text:
              raise SystemExit('modal-box pattern not found')
          text = text.replace(old_box, new_box, 1)

          old_gray = '''.modal-button.gray{\n  background:#293540;\n}'''
          new_gray = '''.modal-button.gray{\n  background:#293540;\n}\n\n/* ADD_MODAL_CLOSE_ICON_V1 */\n#addModal .modal-button.gray{\n  position:absolute;\n  top:10px;\n  right:12px;\n  z-index:10;\n\n  width:38px;\n  height:38px;\n  margin:0;\n  padding:0;\n\n  border:1px solid rgba(255,255,255,.13);\n  border-radius:50%;\n\n  background:rgba(0,0,0,.45);\n  color:#fff;\n\n  font-size:0;\n}\n\n#addModal .modal-button.gray::after{\n  content:"×";\n  display:flex;\n  align-items:center;\n  justify-content:center;\n\n  width:100%;\n  height:100%;\n\n  color:#fff;\n  font-size:23px;\n  font-weight:400;\n  line-height:1;\n}'''
          if old_gray not in text:
              raise SystemExit('gray button pattern not found')
          text = text.replace(old_gray, new_gray, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit UI fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix add point modal close icon'
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-add-modal-close.yml || true
          git commit -m 'Remove temporary UI fix workflow' || true
          git push || true
