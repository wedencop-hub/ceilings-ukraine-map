name: Fix map loader
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-map-loader.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Google Maps loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''  script.src =\n    "https://maps.googleapis.com/maps/api/js" +\n    "?key=AIzaSyD8juKXcYCwBIqfLzQFW4qVApkKxosmQFw" +\n    "&callback=initMap" +\n    "&libraries=geometry" +\n    "&language=uk" +\n    "&region=UA" +\n    "";'''
          new='''  script.src =\n    "https://maps.googleapis.com/maps/api/js" +\n    "?key=AIzaSyD8juKXcYCwBIqfLzQFW4qVApkKxosmQFw" +\n    "&callback=initMap" +\n    "&libraries=geometry" +\n    "&language=uk" +\n    "&region=UA" +\n    "&loading=async" +\n    "";'''
          if old not in s:
              raise SystemExit('target loader block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix Google Maps loader compatibility" || exit 0
          git push
