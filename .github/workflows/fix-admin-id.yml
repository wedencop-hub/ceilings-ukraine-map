name: Fix admin ID

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace old admin ID
        run: |
          if grep -q '8186262020' index.html; then
            sed -i 's/8186262020/1454798203/g' index.html
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Set admin Telegram ID to 1454798203'
            git push
          else
            echo 'Admin ID already updated.'
          fi
