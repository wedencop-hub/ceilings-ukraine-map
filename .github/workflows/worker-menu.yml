name: Configure Worker Menu Bot

on:
  push:
    paths:
      - 'worker-menu/**'
      - '.github/workflows/worker-menu.yml'
  workflow_dispatch:

jobs:
  configure-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e
          WEBHOOK_URL="https://usggjqukcqzttrilgmmo.supabase.co/functions/v1/worker-menu?token=${TELEGRAM_BOT_TOKEN}"
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "url=${WEBHOOK_URL}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook"
          echo
          echo "Worker menu webhook configured successfully."
