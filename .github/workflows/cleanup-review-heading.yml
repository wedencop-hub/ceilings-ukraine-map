name: Cleanup review heading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove duplicate review heading
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          heading = '      <div class="review-form-title" style="margin-top:14px">💬 Написати відгук</div>'
          review_input = '''      <input\n        id="reviewName"\n        class="input"\n        placeholder="Ваше ім'я"\n      >'''
          s = s.replace(heading, '')
          s = s.replace(review_input, heading + '\n\n' + review_input, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit and push with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clean duplicate review heading"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; git add index.html; git diff --cached --quiet && exit 0; git commit -m "Clean duplicate review heading"; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1