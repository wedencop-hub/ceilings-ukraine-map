name: Fix review name rule

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch review validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Update the helper text to describe the exact rule.
          s = s.replace(
              'Можна залишити лише оцінку ⭐ — ім\'я та відгук необов\'язкові.',
              'Оцінка ⭐ обов\'язкова. Ім\'я потрібне лише якщо ви пишете текст відгуку.'
          )

          # Add a capture-phase guard to the review form. Rating is always required;
          # name/text are optional except that text requires a name.
          guard = r'''\n<script>\n(function(){\n  if(window.__reviewNameRuleInstalled) return;\n  window.__reviewNameRuleInstalled = true;\n  document.addEventListener('click', function(e){\n    var btn = e.target && e.target.closest ? e.target.closest('.review-form button[type="submit"], .review-form .modal-button') : null;\n    if(!btn) return;\n    var form = btn.closest('.review-form');\n    if(!form) return;\n    var inputs = form.querySelectorAll('input');\n    var nameEl = null;\n    for(var i=0;i<inputs.length;i++){\n      var ph = (inputs[i].placeholder || '').toLowerCase();\n      var nm = (inputs[i].name || '').toLowerCase();\n      if(ph.indexOf('ім') >= 0 || ph.indexOf('им') >= 0 || nm.indexOf('name') >= 0 || nm.indexOf('author') >= 0){ nameEl = inputs[i]; break; }\n    }\n    if(!nameEl && inputs.length) nameEl = inputs[0];\n    var textEl = form.querySelector('textarea');\n    var name = nameEl ? nameEl.value.trim() : '';\n    var text = textEl ? textEl.value.trim() : '';\n    if(text && !name){\n      e.preventDefault();\n      e.stopImmediatePropagation();\n      alert('Якщо ви пишете відгук, будь ласка, вкажіть ім\'я.');\n    }\n  }, true);\n})();\n</script>\n'''
          if '__reviewNameRuleInstalled' not in s:
              s = s.replace('</body>', guard + '</body>', 1)

          if s != original:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Require name when review text is provided"
          git push
