name: Apply map fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Apply map fixes') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Make the text caret visible in all form fields.
          if 'caret-color:#ffffff;' not in s:
              s = s.replace(
                  '.input,\n.select,\n.textarea{\n',
                  '.input,\n.select,\n.textarea{\n  caret-color:#ffffff;\n  -webkit-text-fill-color:#ffffff;\n\n',
                  1
              )

          # 2) Replace point-picking with long press on touch devices.
          picker = r'''function startMapPick(){
            closeAdd();
            pickMode=true;
            alert("Натисніть і утримуйте палець на потрібному місці приблизно 1 секунду.");
          }

          function setupLongPressPicker(){
            const el = map.getDiv();
            let timer = null;
            let startX = 0;
            let startY = 0;
            let active = false;

            function cancel(){
              if(timer){ clearTimeout(timer); timer=null; }
              active=false;
            }

            function latLngAt(x,y){
              const projection = map.getProjection();
              if(!projection) return null;
              const rect = el.getBoundingClientRect();
              const center = projection.fromLatLngToPoint(map.getCenter());
              const scale = Math.pow(2, map.getZoom());
              const px = x - rect.left;
              const py = y - rect.top;
              const world = new google.maps.Point(
                center.x + (px - rect.width/2) / scale,
                center.y + (py - rect.height/2) / scale
              );
              return projection.fromPointToLatLng(world);
            }

            function start(x,y){
              if(!pickMode) return;
              startX=x; startY=y; active=true;
              timer=setTimeout(()=>{
                if(!active || !pickMode) return;
                const ll=latLngAt(startX,startY);
                if(ll){
                  setCoordinates(ll.lat(),ll.lng());
                  if(navigator.vibrate) navigator.vibrate(30);
                }
                cancel();
              },700);
            }

            function move(x,y){
              if(active && Math.hypot(x-startX,y-startY)>12) cancel();
            }

            el.addEventListener('touchstart',e=>{
              if(!pickMode) return;
              const t=e.touches[0];
              start(t.clientX,t.clientY);
            },{passive:true});
            el.addEventListener('touchmove',e=>{
              if(!active) return;
              const t=e.touches[0];
              move(t.clientX,t.clientY);
            },{passive:true});
            el.addEventListener('touchend',cancel,{passive:true});
            el.addEventListener('touchcancel',cancel,{passive:true});
            el.addEventListener('mousedown',e=>{ if(e.button===0) start(e.clientX,e.clientY); });
            el.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
            el.addEventListener('mouseup',cancel);
            el.addEventListener('mouseleave',cancel);
          }

          '''

          # Remove an older picker implementation if it exists, then install the new one.
          s = re.sub(r'function startMapPick\(\)\s*\{.*?\n\}\s*\n\s*function setupLongPressPicker\(\)\s*\{.*?\n\}\s*\n', '', s, flags=re.S)
          s = re.sub(r'function startMapPick\(\)\s*\{.*?\n\}\s*\n', '', s, count=1, flags=re.S)
          marker = 'function setCoordinates('
          pos = s.find(marker)
          if pos == -1:
              raise SystemExit('setCoordinates() not found')
          s = s[:pos] + picker + s[pos:]

          # 3) Selecting coordinates automatically reverse-geocodes the address.
          new_coords = r'''function setCoordinates(lat,lng){
            selectedLat=Number(lat); selectedLng=Number(lng);
            if(temporaryMarker) temporaryMarker.setMap(null);
            temporaryMarker=new google.maps.Marker({position:{lat:selectedLat,lng:selectedLng},map,draggable:true,title:"Нова точка"});
            temporaryMarker.addListener("dragend",()=>{const p=temporaryMarker.getPosition();selectedLat=p.lat();selectedLng=p.lng();updateCoordinates();reverseGeocode(selectedLat,selectedLng);});
            map.panTo({lat:selectedLat,lng:selectedLng}); map.setZoom(16); updateCoordinates();
            reverseGeocode(selectedLat,selectedLng);
            pickMode=false;
            document.getElementById("addModal").style.display="flex";
          }

          function reverseGeocode(lat,lng){
            if(!window.google||!google.maps)return;
            new google.maps.Geocoder().geocode({location:{lat:Number(lat),lng:Number(lng)},language:"uk",region:"UA"},(results,status)=>{
              if(status!=="OK"||!results||!results.length)return;
              const input=document.getElementById("newAddress");
              if(input) input.value=results[0].formatted_address;
              const box=document.getElementById("addressResults");
              if(box) box.innerHTML="";
            });
          }
          '''
          s = re.sub(r'function setCoordinates\(.*?\n\}\s*\n\s*function updateCoordinates', new_coords + '\nfunction updateCoordinates', s, count=1, flags=re.S)

          # 4) Start the long-press listener after the map is initialized.
          if 'setupLongPressPicker();' not in s:
              needle = '  setupInterface();'
              if needle in s:
                  s = s.replace(needle, '  setupLongPressPicker();\n\n' + needle, 1)
              else:
                  raise SystemExit('setupInterface() not found')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Apply map fixes"
          git push
