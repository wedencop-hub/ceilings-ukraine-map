name: Install map protection
on:
  push:
    paths:
      - 'map-protection.js'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add protection script to page head
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="map-protection.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</head>', tag+'\n</head>')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Add map startup protection'
          git push
