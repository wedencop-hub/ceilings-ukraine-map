name: Apply app compatibility fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Apply app compatibility fixes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Photo upload compatibility
          old='''  if(file){\n\n    place.logo_data =\n      await fileToBase64(\n        file\n      );\n\n    place.logo_type =\n      file.type;\n\n  }'''
          new='''  if(file){\n\n    const prepared =\n      await prepareImageFile(file);\n\n    place.logo_data =\n      prepared.data;\n\n    place.logo_type =\n      "image/jpeg";\n\n  }'''
          if old in s:
              s=s.replace(old,new,1)

          marker='function fileToBase64(\n  file\n){'
          helper='''async function prepareImageFile(file){\n\n  if(!file){\n    throw new Error("Фото не вибране.");\n  }\n\n  if(!file.type.startsWith("image/")){\n    throw new Error("Оберіть файл зображення.");\n  }\n\n  const maxSide=1600;\n  const data=await fileToBase64(file);\n\n  try{\n    const img=await new Promise((resolve,reject)=>{\n      const image=new Image();\n      image.onload=()=>resolve(image);\n      image.onerror=reject;\n      image.src=data;\n    });\n\n    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));\n    const canvas=document.createElement("canvas");\n    canvas.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));\n    canvas.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));\n    const ctx=canvas.getContext("2d");\n    ctx.drawImage(img,0,0,canvas.width,canvas.height);\n    return {data:canvas.toDataURL("image/jpeg",0.82)};\n  }catch(e){\n    if(/heic|heif/i.test(file.type||file.name||"")){\n      throw new Error("iPhone HEIC не підтримується браузером. Відкрийте фото в Фото та виберіть JPG/JPEG.");\n    }\n    return {data};\n  }\n}\n\n\n'''+marker
          if 'async function prepareImageFile(file)' not in s and marker in s:
              s=s.replace(marker,helper,1)

          # Fix Google Maps loading in Telegram WebView.
          s=s.replace('&loading=async', '')
          if 'MAP LOAD TIMEOUT' not in s:
              needle='''  script.defer =\n    true;'''
              replacement='''  script.defer =\n    true;\n\n  script.onload =\n    function(){\n      setTimeout(function(){\n        if(!(window.google && window.google.maps)){\n          showMapLoadError("Google Maps не відповів у Telegram.");\n        }\n      },7000);\n    };'''
              if needle in s:
                  s=s.replace(needle,replacement,1)

              marker2='''/* =====================================================\n   GOOGLE MAPS LOADER\n===================================================== */'''
              helper2='''function showMapLoadError(message){\n  const mapBox=document.getElementById("map");\n  if(!mapBox)return;\n  mapBox.innerHTML=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;background:#101b25;color:#fff;z-index:9999"><div><div style="font-size:44px">🗺️</div><div style="font-size:19px;font-weight:800;margin-top:8px">Карта не завантажилась</div><div style="font-size:14px;color:#9aa7b4;margin-top:8px">${message}</div><button onclick="location.reload()" style="margin-top:16px;padding:11px 18px;border:0;border-radius:10px;background:#087cf5;color:#fff;font-weight:800">Оновити</button></div></div>`;\n}\n\n\n'''+marker2
              if marker2 in s:
                  s=s.replace(marker2,helper2,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply app compatibility fixes"
            git push
          fi
