name: Apply app compatibility fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Apply app compatibility fixes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Repair the two custom blocks if an earlier updater wrote literal \\n          # characters instead of real line breaks.
          css_start='\\n/* CUSTOM LOGO + RATING MAP MARKERS */'
          css_end='\n/* =========================\n   TOP\n========================= */'
          if css_start in s:
              a=s.index(css_start)
              b=s.index(css_end,a)
              block=s[a:b].replace('\\n','\n')
              s=s[:a]+block+s[b:]

          overlay_start='\\nclass LogoRatingOverlay extends google.maps.OverlayView'
          overlay_end='\n\nfunction renderMarkers(){'
          if overlay_start in s:
              a=s.index(overlay_start)
              b=s.index(overlay_end,a)
              block=s[a:b].replace('\\n','\n')
              s=s[:a]+block+s[b:]

          # Photo upload compatibility
          old='''  if(file){\n\n    place.logo_data =\n      await fileToBase64(\n        file\n      );\n\n    place.logo_type =\n      file.type;\n\n  }'''
          new='''  if(file){\n\n    const prepared =\n      await prepareImageFile(file);\n\n    place.logo_data =\n      prepared.data;\n\n    place.logo_type =\n      "image/jpeg";\n\n  }'''
          if old in s:
              s=s.replace(old,new,1)

          marker='function fileToBase64(\n  file\n){'
          helper='''async function prepareImageFile(file){\n\n  if(!file){\n    throw new Error("Фото не вибране.");\n  }\n\n  if(!file.type.startsWith("image/")){\n    throw new Error("Оберіть файл зображення.");\n  }\n\n  const maxSide=1600;\n  const data=await fileToBase64(file);\n\n  try{\n    const img=await new Promise((resolve,reject)=>{\n      const image=new Image();\n      image.onload=()=>resolve(image);\n      image.onerror=reject;\n      image.src=data;\n    });\n\n    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));\n    const canvas=document.createElement("canvas");\n    canvas.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));\n    canvas.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));\n    const ctx=canvas.getContext("2d");\n    ctx.drawImage(img,0,0,canvas.width,canvas.height);\n    return {data:canvas.toDataURL("image/jpeg",0.82)};\n  }catch(e){\n    if(/heic|heif/i.test(file.type||file.name||"")){\n      throw new Error("iPhone HEIC не підтримується браузером. Відкрийте фото в Фото та виберіть JPG/JPEG.");\n    }\n    return {data};\n  }\n}\n\n\n'''+marker
          if 'async function prepareImageFile(file)' not in s and marker in s:
              s=s.replace(marker,helper,1)

          # Custom logo + rating marker CSS
          css=r'''\n/* CUSTOM LOGO + RATING MAP MARKERS */\n.custom-map-marker{\n  position:absolute;\n  transform:translate(-50%,-100%);\n  display:flex;\n  align-items:center;\n  gap:6px;\n  padding:5px 8px 5px 5px;\n  background:rgba(255,255,255,.98);\n  color:#111;\n  border:2px solid rgba(0,0,0,.18);\n  border-radius:22px;\n  box-shadow:0 4px 14px rgba(0,0,0,.42);\n  font-size:13px;\n  font-weight:800;\n  white-space:nowrap;\n  cursor:pointer;\n  user-select:none;\n  -webkit-user-select:none;\n}\n.custom-map-marker::after{\n  content:"";\n  position:absolute;\n  left:50%;\n  bottom:-7px;\n  width:12px;\n  height:12px;\n  background:#fff;\n  transform:translateX(-50%) rotate(45deg);\n  border-right:2px solid rgba(0,0,0,.12);\n  border-bottom:2px solid rgba(0,0,0,.12);\n  z-index:-1;\n}\n.custom-map-marker .marker-logo{\n  width:34px;\n  height:34px;\n  object-fit:cover;\n  border-radius:50%;\n  background:#f1f3f5;\n  border:2px solid #fff;\n  box-shadow:0 1px 5px rgba(0,0,0,.2);\n}\n.custom-map-marker .marker-logo-fallback{\n  width:34px;\n  height:34px;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  border-radius:50%;\n  background:#087cf5;\n  color:#fff;\n  font-size:18px;\n}\n.custom-map-marker .marker-rating-text{\n  display:flex;\n  align-items:center;\n  gap:3px;\n  line-height:1;\n}\n.custom-map-marker .marker-star{\n  color:#f5b900;\n  font-size:16px;\n}\n'''
          if '/* CUSTOM LOGO + RATING MAP MARKERS */' not in s:
              s=s.replace('/* =========================\n   TOP\n========================= */',css+'\n/* =========================\n   TOP\n========================= */',1)

          # Custom Google Maps OverlayView
          overlay=r'''\nclass LogoRatingOverlay extends google.maps.OverlayView{\n  constructor(position,place,clickHandler){\n    super();\n    this.position=position;\n    this.place=place;\n    this.clickHandler=clickHandler;\n    this.div=null;\n  }\n  onAdd(){\n    const div=document.createElement("div");\n    div.className="custom-map-marker";\n    div.setAttribute("role","button");\n    div.setAttribute("aria-label",this.place.name||"Точка");\n    const logo=this.place.logo_url\n      ? `<img class="marker-logo" src="${escapeAttribute(this.place.logo_url)}" alt="">`\n      : `<div class="marker-logo-fallback">🏠</div>`;\n    const rating=Number(this.place.rating||0);\n    const ratingText=rating>0?rating.toFixed(1):"—";\n    div.innerHTML=logo+`<span class="marker-rating-text"><span class="marker-star">★</span>${ratingText}</span>`;\n    div.addEventListener("click",this.clickHandler);\n    div.addEventListener("touchend",event=>{event.preventDefault();this.clickHandler(event);},{passive:false});\n    this.div=div;\n    this.getPanes().overlayMouseTarget.appendChild(div);\n  }\n  draw(){\n    if(!this.div)return;\n    const projection=this.getProjection();\n    const point=projection.fromLatLngToDivPixel(this.position);\n    if(!point)return;\n    this.div.style.left=point.x+"px";\n    this.div.style.top=point.y+"px";\n  }\n  onRemove(){\n    if(this.div){this.div.remove();this.div=null;}\n  }\n}\n'''
          if 'class LogoRatingOverlay extends google.maps.OverlayView' not in s:
              s=s.replace('function renderMarkers(){',overlay+'\n\nfunction renderMarkers(){',1)

          old_marker=re.compile(r'''      const marker =\n        new google\.maps\.Marker\(\n          \{.*?\n          \}\n        \);\n\n\n      marker\.addListener\(\n        "click",\n        function\(\)\{\n\n          openPlace\(\n            place\n          \);\n\n        \}\n      \);\n\n\n      place\.__marker =\n        marker;''',re.S)
          new_marker='''      const marker =\n        new LogoRatingOverlay(\n          new google.maps.LatLng(lat,lng),\n          place,\n          function(){\n            openPlace(place);\n          }\n        );\n\n      marker.setMap(map);\n\n      place.__marker =\n        marker;'''
          s,count=old_marker.subn(new_marker,s,count=1)
          if count!=1 and 'new LogoRatingOverlay' not in s:
              raise SystemExit('Marker block was not found')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply app compatibility fixes"
            git push
          fi
