name: Apply app compatibility fixes
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Apply app compatibility fixes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n\s*<button\s+id="mapTypeButton".*?</button>\s*','\n',s,count=1,flags=re.S)
          start=s.find('class LogoRatingOverlay extends google.maps.OverlayView{')
          end=s.find('\n\n\nfunction renderMarkers',start)
          if start>=0 and end>start:
              b=''
              s=s[:start]+base64.b64decode(b).decode()+s[end+3:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Apply app compatibility fixes" || exit 0
          git push
