name: Apply app compatibility fixes
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Apply app compatibility fixes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=re.sub(r'\n\s*<button\s+id="mapTypeButton".*?</button>\s*','\n',s,count=1,flags=re.S)
          start=s.find('class LogoRatingOverlay extends google.maps.OverlayView{')
          end=s.find('\n\n\nfunction renderMarkers',start)
          if start>=0 and end>start:
              b=''
              s=s[:start]+base64.b64decode(b).decode('utf-8')+s[end+3:]

          # Remove Instrument from the map filter.
          s=re.sub(r'\n\s*<button\s+class="category"\s+data-cat="tools">.*?</button>\s*', '\n', s, count=1, flags=re.S)

          # Always show a flame marker for gas points.
          old_marker='''      const logo=self.place.logo_url\n        ? `<img class="marker-logo" src="${escapeAttribute(self.place.logo_url)}" alt="">`\n        : `<div class="marker-logo-fallback">+</div>`;\n'''
          new_marker='''      const category=String(self.place.category||"");\n      const isGas=category==="gas";\n      const logo=isGas\n        ? `<div class="marker-logo-fallback gas-marker-logo">🔥</div>`\n        : self.place.logo_url\n          ? `<img class="marker-logo" src="${escapeAttribute(self.place.logo_url)}" alt="">`\n          : `<div class="marker-logo-fallback">+</div>`;\n'''
          if old_marker in s:
              s=s.replace(old_marker,new_marker,1)

          old_css=''' .custom-map-marker .marker-logo-fallback{'''
          if '.gas-marker-logo' not in s:
              s=s.replace('.custom-map-marker .marker-logo-fallback{', '.custom-map-marker .marker-logo-fallback{', 1)
              marker_css='''.custom-map-marker .gas-marker-logo{\n  background:#fff3e0;\n  color:#ff6d00;\n  font-size:21px;\n}\n'''
              pos=s.find('/* =========================\n   TOP')
              if pos>=0:
                  s=s[:pos]+marker_css+'\n'+s[pos:]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Apply app compatibility fixes" || exit 0
          git pull --rebase origin main
          git push
