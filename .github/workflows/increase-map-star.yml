name: Increase map star
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-star:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase map rating star
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''.custom-map-marker .marker-star{\n  color:#f5b900;\n  font-size:16px;\n}'''
          new='''.custom-map-marker .marker-star{\n  color:#f5b900;\n  font-size:20px;\n}'''
          if old in s:
              p.write_text(s.replace(old,new,1))
          else:
              print('Star size already changed or pattern not found')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Increase map rating star size [skip ci]"
          git push
