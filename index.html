<style>
*{box-sizing:border-box}

html,body{

.filterbtn{

<script>

const SUPABASE_URL=
"https://usggjqukcqzttrilgmmo.supabase.co";

const SUPABASE_KEY=
"sb_publishable_g3Hi1tMxV4sV5bYXBpijBA_nHFd0zxA";

const MAP_API=
SUPABASE_URL+
"/functions/v1/map-api";

const OWNER_ID=
"8186262020";

let tg=
window.Telegram &&
window.Telegram.WebApp
?
window.Telegram.WebApp
:
null;

let telegramId="";

let currentAdmin=null;

let places=[];

let markers=[];

let map=null;

let currentPlace=null;

let selectedLat=null;

let selectedLng=null;

let pickMode=false;

let pickMarker=null;

let editingId=null;

let selectedRating=0;

let activeCategory="all";


/* ================================
API
================================ */

async function api(body){

const r=
await fetch(
MAP_API,
{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},
body:JSON.stringify(body)
}
);

const data=
await r.json();

if(!r.ok){

throw new Error(
data.error||
"Помилка сервера"
);

}

return data;

}


/* ================================
INIT
================================ */

async function initMap(){

if(tg){

tg.ready();
tg.expand();

telegramId=
String(
tg.initDataUnsafe?.user?.id||
""
);

}


map=
new google.maps.Map(
document.getElementById("map"),
{
center:{
lat:48.5,
lng:31.2
},
zoom:6,
mapTypeControl:false,
streetViewControl:false,
fullscreenControl:false,
gestureHandling:"greedy",
styles:darkMapStyle()
}
);


map.addListener(
"click",
e=>{

if(pickMode){

setCoordinates(
e.latLng.lat(),
e.latLng.lng()
);

}

});


document
.querySelectorAll(".cat")
.forEach(
button=>{

button.onclick=()=>{

document
.querySelectorAll(".cat")
.forEach(
b=>b.classList.remove("active")
);

button.classList.add("active");

activeCategory=
button.dataset.cat;

renderMarkers();

};

}
);


document
.getElementById("search")
.addEventListener(
"input",
renderMarkers
);


setupStars();

await loadPlaces();

await detectAdmin();

}


/* ================================
DARK MAP
================================ */

function darkMapStyle(){

return [

{
elementType:"geometry",
stylers:[
{color:"#18212b"}
]
},

{
elementType:"labels.text.fill",
stylers:[
{color:"#b8c2cc"}
]
},

{
elementType:"labels.text.stroke",
stylers:[
{color:"#18212b"}
]
},

{
featureType:"road",
elementType:"geometry",
stylers:[
{color:"#354250"}
]
},

{
featureType:"road.highway",
elementType:"geometry",
stylers:[
{color:"#455463"}
]
},

{
featureType:"water",
elementType:"geometry",
stylers:[
{color:"#071e3c"}
]
},

{
featureType:"poi",
stylers:[
{visibility:"simplified"}
]
}

];

}


/* ================================
ADMIN DETECTION
================================ */

async function detectAdmin(){

if(!telegramId){

return;

}


try{

const list=
await api({
action:"admins",
telegram_id:
telegramId
});


currentAdmin=
list.find(
a=>
String(a.telegram_id)===
telegramId &&
a.active
)
||
null;


if(currentAdmin){

document
.getElementById("adminButton")
.style.display=
"block";


if(currentAdmin.role==="owner"){

document
.getElementById(
"ownerAdminSection"
)
.style.display=
"block";

}

}

}catch(e){

console.log(
"Not admin"
);

}

}

function renderMarkers(){

markers.forEach(
m=>m.setMap(null)
);

markers=[];


const query=
document
.getElementById("search")
.value
.toLowerCase()
.trim();


places.forEach(
place=>{

const categoryOk=
activeCategory==="all"||
place.category===
activeCategory;


const text=
(
place.name+
" "+
(place.address||"")
)
.toLowerCase();


const searchOk=
!query||
text.includes(query);


if(
!categoryOk||
!searchOk
){

return;

}


const rating=
Number(place.rating||0);


const marker=
new google.maps.Marker({

map:map,

position:{
lat:Number(place.latitude),
lng:Number(place.longitude)
},

title:place.name,

label:{
text:
rating
?
"★ "+rating.toFixed(1)
:
"★ —",

color:"#111",
fontWeight:"800",
fontSize:"13px"
}

});


marker.addListener(
"click",
()=>openPlace(place)
);


markers.push(marker);

}
);


document
.getElementById("empty")
.style.display=
markers.length
?
"none"
:
"block";

}

async function searchAddress(){

);

const box=
document
.getElementById(
"addressResults"
);

"🔎 Шукаємо адресу...";


try{

const url=
"https://nominatim.openstreetmap.org/search"+
"?format=jsonv2"+
"&countrycodes=ua"+
"&limit=5"+
"&accept-language=uk"+
"&q="+
encodeURIComponent(q);


const r=
await fetch(url);


const data=
await r.json();


if(!data.length){

box.innerHTML=
"❌ Адресу не знайдено.";

return;

}


box.innerHTML="";


data.forEach(
item=>{

const button=
document.createElement(
"button"
);

button.className=
"address-result";

button.textContent=
"📍 "+
item.display_name;

button.onclick=
()=>{

setCoordinates(
Number(item.lat),
Number(item.lon)
);

document
.getElementById(
"newAddress"
)
.value=
item.display_name;

box.innerHTML="";

};

box.appendChild(
button
);

}
);

}catch(e){

"❌ Помилка пошуку.";

}

}

function setCoordinates(lat,lng){

selectedLat=lat;
selectedLng=lng;


if(pickMarker){

pickMarker.setMap(null);

}


pickMarker=
new google.maps.Marker({

map:map,

position:{
lat:lat,
lng:lng
},

draggable:true

});


pickMarker.addListener(
"dragend",
()=>{

const p=
pickMarker.getPosition();

selectedLat=
p.lat();

selectedLng=
p.lng();

updateCoords();

}
);


map.setCenter({
lat:lat,
lng:lng
});

map.setZoom(16);

updateCoords();

pickMode=false;

document
.getElementById("addModal")
.style.display=
"flex";

}

/* ================================
UTILITIES
================================ */

function stars(rating){

let result="";

for(let i=1;i<=5;i++){

result+=
i<=Math.round(rating)
?
"★"
:
"☆";

}

return result;

}


function formatDate(date){

return new Date(date)
.toLocaleDateString(
"uk-UA",
{
day:"numeric",
month:"long",
year:"numeric"
}
);

}


function safeUrl(url){

if(
!/^https?:\/\//i.test(url)
){

return "https://"+
url;

}

return url;

}


function esc(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function fileToBase64(file){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=
()=>resolve(
reader.result
);

reader.onerror=
reject;

reader.readAsDataURL(file);

}
}


function zoomIn(){

map.setZoom(
map.getZoom()+1
);

}


function zoomOut(){

map.setZoom(
map.getZoom()-1
);

}


function findMe(){

if(!navigator.geolocation){

return;

}

navigator.geolocation.getCurrentPosition(
position=>{

const p={
lat:position.coords.latitude,
lng:position.coords.longitude
};

map.setCenter(p);
map.setZoom(14);

new google.maps.Marker({
map:map,
position:p,
title:"Моє місцезнаходження"
});

},
()=>{
alert(
"Не вдалося отримати місцезнаходження."
);
}
);


}

const el=
document.getElementById(
"categories"
);

el.style.display=
el.style.display==="none"
?
"flex"
:
"none";

}
