<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Карта натяжних стель України</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Верхняя панель */

    .top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 2px 4px 8px;
    }

    .search {
      width: 100%;
      height: 42px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }

    /* Категории */

    .categories {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 9px 0 2px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: 0;
      border-radius: 20px;
      padding: 9px 13px;
      background: #eeeeee;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .category.active {
      background: #229ed9;
      color: white;
    }

    /* Карта */

    #map {
      position: absolute;
      top: 128px;
      bottom: 0;
      left: 0;
      right: 0;
    }

    /* Моя позиция */

    .location-button {
      position: absolute;
      right: 14px;
      bottom: 18px;
      z-index: 5;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: white;
      box-shadow: 0 3px 12px rgba(0,0,0,.25);
      font-size: 22px;
    }

    /* Карточка */

    .card {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 20;
      background: white;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 4px 25px rgba(0,0,0,.3);
      display: none;
      max-height: 65%;
      overflow-y: auto;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-info {
      font-size: 14px;
      line-height: 1.55;
      color: #444;
    }

    .buttons {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      background: #229ed9;
      color: white;
    }

    .button.close {
      background: #eeeeee;
      color: #222;
    }

    /* Сообщение */

    .empty {
      display: none;
      position: absolute;
      top: 145px;
      left: 20px;
      right: 20px;
      z-index: 8;
      background: white;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,.15);
    }

  </style>
</head>

<body>

<div id="app">

  <div class="top">

    <div class="title">
      🗺 Карта натяжних стель України
    </div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔍 Пошук міста, компанії..."
    >

    <div class="categories">

      <button class="category active" data-category="all">
        Всі
      </button>

      <button class="category" data-category="manufacturer">
        🏭 Виробники
      </button>

      <button class="category" data-category="shop">
        🏪 Магазини
      </button>

      <button class="category" data-category="tools">
        🔧 Інструмент
      </button>

      <button class="category" data-category="gas">
        🔥 Газ
      </button>

      <button class="category" data-category="logistics">
        🚚 Логістика
      </button>

      <button class="category" data-category="services">
        🛠 Послуги
      </button>

    </div>

  </div>


  <div id="map"></div>


  <button
    class="location-button"
    onclick="findMe()"
    title="Моє місцезнаходження">
    ◎
  </button>


  <div id="empty" class="empty">
    Нічого не знайдено
  </div>


  <div id="card" class="card">

    <div id="cardTitle" class="card-title"></div>

    <div id="cardInfo" class="card-info"></div>

    <div class="buttons">

      <button id="routeButton" class="button">
        🧭 ПРОКЛАСТИ МАРШРУТ
      </button>

      <button id="telegramButton" class="button">
        ✈️ TELEGRAM
      </button>

      <button id="shareButton" class="button">
        ↗️ ПОДІЛИТИСЯ ТОЧКОЮ
      </button>

      <button class="button close" onclick="closeCard()">
        Закрити
      </button>

    </div>

  </div>

</div>


<script>

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  let map;
  let userMarker = null;

  let activeCategory = "all";
  let markers = [];


  /*
    НАШІ ТОЧКИ

    Далі цей список перенесемо
    в окрему базу.
  */

  const places = [

    {
      name: "Potolki Everest / EverestComplekt",

      category: "shop",
      categoryName: "🏪 Постачальник",

      address: "вул. Академіка Булаховського, 2/1, Київ",

      phone: "+380 67 393 99 37",

      telegram: "https://t.me/igor_everest",

      lat: 50.4714,
      lng: 30.35052
    },


    {
      name: "GoodHub",

      category: "services",
      categoryName: "🛠 Послуги для монтажників",

      address: "Вишневе, Київська область",

      phone: "",

      telegram: "",

      lat: 50.387,
      lng: 30.370
    }

  ];


  function initMap() {

    map = new google.maps.Map(
      document.getElementById("map"),
      {
        center: {
          lat: 48.5,
          lng: 31.2
        },

        zoom: 6,

        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,

        gestureHandling: "greedy"
      }
    );


    createMarkers();

    setupSearch();

    setupCategories();

  }


  function createMarkers() {

    markers.forEach(item => {
      item.marker.setMap(null);
    });

    markers = [];


    places.forEach(place => {

      const marker = new google.maps.Marker({

        position: {
          lat: place.lat,
          lng: place.lng
        },

        map: map,

        title: place.name

      });


      marker.addListener(
        "click",
        () => openCard(place)
      );


      markers.push({
        place: place,
        marker: marker
      });

    });

  }


  function setupCategories() {

    document.querySelectorAll(".category")
      .forEach(button => {

        button.addEventListener("click", () => {

          document
            .querySelectorAll(".category")
            .forEach(b => b.classList.remove("active"));

          button.classList.add("active");

          activeCategory =
            button.dataset.category;

          filterPlaces();

        });

      });

  }


  function setupSearch() {

    document
      .getElementById("search")
      .addEventListener(
        "input",
        filterPlaces
      );

  }


  function filterPlaces() {

    const query =
      document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    let visible = 0;


    markers.forEach(item => {

      const place = item.place;


      const categoryOK =
        activeCategory === "all" ||
        place.category === activeCategory;


      const searchText =
        (
          place.name +
          " " +
          place.address +
          " " +
          place.categoryName
        ).toLowerCase();


      const searchOK =
        !query ||
        searchText.includes(query);


      if (categoryOK && searchOK) {

        item.marker.setMap(map);

        visible++;

      } else {

        item.marker.setMap(null);

      }

    });


    document
      .getElementById("empty")
      .style.display =
        visible === 0 ? "block" : "none";

  }


  function openCard(place) {

    document
      .getElementById("cardTitle")
      .textContent =
        place.name;


    document
      .getElementById("cardInfo")
      .innerHTML =

      `<b>${place.categoryName}</b><br>
       📍 ${place.address}<br>
       ${place.phone ? "📞 " + place.phone : ""}`;


    document
      .getElementById("card")
      .style.display =
        "block";


    document
      .getElementById("routeButton")
      .onclick = () => {

        const url =
          "https://www.google.com/maps/dir/?api=1" +
          "&destination=" +
          place.lat +
          "," +
          place.lng;

        tg.openLink(url);

      };


    document
      .getElementById("telegramButton")
      .onclick = () => {

        if (place.telegram) {

          tg.openTelegramLink(
            place.telegram
          );

        } else {

          tg.showAlert(
            "Telegram для цієї точки поки не додано."
          );

        }

      };


    document
      .getElementById("shareButton")
      .onclick = () => {

        const text =
          "📍 " +
          place.name +
          "\n" +
          place.address +
          "\n\n" +
          "🗺 Карта натяжних стель України";


        const shareUrl =
          "https://t.me/share/url?url=" +

          encodeURIComponent(
            "https://wedencop-hub.github.io/ceilings-ukraine-map/"
          ) +

          "&text=" +

          encodeURIComponent(text);


        tg.openTelegramLink(
          shareUrl
        );

      };

  }


  function closeCard() {

    document
      .getElementById("card")
      .style.display =
        "none";

  }


  function findMe() {

    if (!navigator.geolocation) {

      tg.showAlert(
        "Ваш браузер не підтримує геолокацію."
      );

      return;
    }


    navigator.geolocation.getCurrentPosition(

      position => {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        const location = {
          lat: lat,
          lng: lng
        };


        map.setCenter(location);

        map.setZoom(13);


        if (userMarker) {
          userMarker.setMap(null);
        }


        userMarker =
          new google.maps.Marker({

            position: location,

            map: map,

            title: "Моє місцезнаходження",

            icon: {
              path:
                google.maps.SymbolPath.CIRCLE,

              scale: 9,

              fillColor: "#229ed9",

              fillOpacity: 1,

              strokeColor: "#ffffff",

              strokeWeight: 3

            }

          });

      },

      () => {

        tg.showAlert(
          "Не вдалося отримати ваше місцезнаходження."
        );

      }

    );

  }

</script>


<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD8juKXcYCwBIqfLzQFW4qVApkKxosmQFw&callback=initMap">
</script>

</body>
</html>
