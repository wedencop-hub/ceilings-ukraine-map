<style>

html,body{

.form-input,

.logo-preview{

.pick-location{

}

.selected-location{

}

.address-result{

text-align:left;

background:white;
padding:11px;
margin-bottom:6px;

cursor:pointer;
}

.address-loading{
padding:10px;

}

.address-error{

background:#fff0f0;

}

.pick-mode{

text-align:center;
box-shadow:0 3px 15px rgba(0,0,0,.25);

}

.empty{
display:none;
position:absolute;
top:145px;
left:20px;

z-index:8;
background:white;

padding:18px;
text-align:center;
box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.pending-item{
border:1px solid #ddd;
border-radius:12px;
padding:12px;
margin-bottom:10px;
}

.pending-name{
font-size:17px;
font-weight:700;
margin-bottom:6px;
}

.pending-info{
font-size:13px;
line-height:1.5;
color:#555;
}

.loading{
padding:20px;
text-align:center;

}
</style>
</head>

<body>

class="card-logo"
style="display:none">

<div id="cardTitle" class="card-title"></div>

<div id="cardInfo" class="card-info"></div>

<div class="buttons">

<button
id="phoneButton"
class="button">

</button>

id="routeButton"
class="button">

class="button">

</button>

</div>


<!-- ADD / EDIT -->

<div id="addModal" class="modal">

<div class="modal-content">

<div
id="formTitle"
class="modal-title">
➕ Додати точку на карту
</div>

<label class="form-label">
Тип точки
</label>

<select
id="newCategory"
class="form-select">

<option value="manufacturer">
🏭 Виробник
</option>

Назва
</label>

id="newName"

✅ Додати точку

<!-- ADMIN -->

👑 Адміністрування
</div>

</div>

class="button"
onclick="openPending()">
⏳ Заявки на модерацію

Закрити
</button>

<script>

/* =========================================
   НАСТРОЙКИ
========================================= */

const SUPABASE_URL =
"https://usggjqukcqzttrilgmmo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_g3Hi1tMxV4sV5bYXBpijBA_nHFd0zxA";

const MAP_API =
SUPABASE_URL +
"/functions/v1/map-api";

const TELEGRAM =
window.Telegram &&
window.Telegram.WebApp
?
window.Telegram.WebApp
:
null;

if(TELEGRAM){
TELEGRAM.ready();
TELEGRAM.expand();
}


/* =========================================
   СОСТОЯНИЕ
========================================= */

let map = null;

let markers = [];

let userMarker = null;

let pickMarker = null;

let selectedLat = null;

let selectedLng = null;

let activeCategory = "all";

let currentPlace = null;

let editingPlaceId = null;

let adminCode = "";

let places = [];


/* =========================================
   API
========================================= */

async function apiGet(){

const response =
await fetch(
MAP_API,
{
method:"GET",
headers:{
"apikey":SUPABASE_KEY
}
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Помилка завантаження"
);

}

return data;

}


async function apiPost(body){

const response =
await fetch(
MAP_API,
{
method:"POST",
headers:{
"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY
},

body:
JSON.stringify(body)
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Помилка сервера"
);

}

return data;

}


/* =========================================
   MAP
========================================= */

async function initMap(){

map =
new google.maps.Map(
document.getElementById("map"),
{
center:{
lat:48.5,
lng:31.2
},

zoom:6,

mapTypeControl:false,

streetViewControl:false,

fullscreenControl:false,

gestureHandling:"greedy"
}
);


map.addListener(
"click",
event=>{

if(
document.getElementById(
"pickMode"
).style.display === "block"
){

setManualLocation(
event.latLng
);

}

}
);


setupCategories();

setupSearch();

await loadPlaces();

}


/* =========================================
   LOAD
========================================= */

async function loadPlaces(){

try{

places =
await apiGet();

createMarkers();

filterPlaces();

}catch(error){

console.error(error);

alert(
"Не вдалося завантажити точки карти:\n" +
error.message
);

}

}


/* =========================================
   MARKERS
========================================= */

function createMarkers(){

markers.forEach(
item=>{
item.marker.setMap(null);
}
);

markers=[];


places.forEach(
place=>{

const marker =
new google.maps.Marker({

position:{
lat:Number(place.latitude),
lng:Number(place.longitude)
},

map:map,

title:place.name

});


marker.addListener(
"click",
()=>openCard(place)
);


markers.push({
place:place,
marker:marker
});

}
);

}


/* =========================================
   FILTER
========================================= */

function setupCategories(){

document
.querySelectorAll(".category")
.forEach(
button=>{

button.addEventListener(
"click",
()=>{

document
.querySelectorAll(".category")
.forEach(
b=>
b.classList.remove("active")
);

button.classList.add("active");

activeCategory =
button.dataset.category;

filterPlaces();

}
);

}
);


}


function setupSearch(){

document
.getElementById("search")
.addEventListener(
"input",
filterPlaces
);

}


function filterPlaces(){

const query =
document
.getElementById("search")
.value
.toLowerCase()
.trim();

let visible=0;


markers.forEach(
item=>{

const p =
item.place;

const categoryOK =
activeCategory==="all" ||
p.category===activeCategory;

const text =
(
(p.name || "") +
" " +
(p.address || "") +
" " +
(p.category_name || "")
)
.toLowerCase();

const searchOK =
!query ||
text.includes(query);

if(
categoryOK &&
searchOK
){

item.marker.setMap(map);

visible++;

}else{

item.marker.setMap(null);

}

}
);


document
.getElementById("empty")
.style.display =
visible===0
?
"block"
:
"none";

}


/* =========================================
   CARD
========================================= */

function openCard(place){

currentPlace =
place;


document
.getElementById(
"cardTitle"
)
.textContent =
place.name;


document
.getElementById(
"cardInfo"
)
.innerHTML =

`<b>${place.category_name || ""}</b><br>
📍 ${escapeHtml(place.address || "")}`;


const logo =
document.getElementById(
"cardLogo"
);


if(place.logo_url){

logo.src =
place.logo_url;

logo.style.display =
"block";

}else{

logo.style.display =
"none";

}


/* PHONE */

const phoneButton =
document.getElementById(
"phoneButton"
);


if(place.phone){

phoneButton.style.display =
"block";

phoneButton.onclick =
()=>{
window.location.href =
"tel:" +
place.phone;
};

}else{

phoneButton.style.display =
"none";

}


/* ROUTE */

document
.getElementById(
"routeButton"
)
.onclick =
()=>{

const url =
"https://www.google.com/maps/dir/?api=1" +
"&destination=" +
place.latitude +
"," +
place.longitude;

if(TELEGRAM){

TELEGRAM.openLink(url);

}else{

window.open(
url,
"_blank"
);

}

};


/* TELEGRAM */

const telegramButton =
document.getElementById(
"telegramButton"
);


if(place.telegram){

telegramButton.style.display =
"block";

telegramButton.onclick =
()=>{

let link =
place.telegram;

if(
!link.startsWith("http")
){

link =
"https://t.me/" +
link.replace("@","");
}

if(TELEGRAM){

TELEGRAM.openLink(link);

}else{

window.open(
link,
"_blank"
);

}

};

}else{

telegramButton.style.display =
"none";

}


/* WEBSITE */

const websiteButton =
document.getElementById(
"websiteButton"
);


if(place.website){

websiteButton.style.display =
"block";

websiteButton.onclick =
()=>{

if(TELEGRAM){

TELEGRAM.openLink(
place.website
);

}else{

window.open(
place.website,
"_blank"
);

}

};

}else{

websiteButton.style.display =
"none";

}


/* SHARE */

document
.getElementById(
"shareButton"
)
.onclick =
()=>{

const text =
"📍 " +
place.name +
"\n" +
(place.address || "") +
"\n\n" +
"🗺 Карта натяжних стель України";

const shareUrl =
"https://t.me/share/url?url=" +
encodeURIComponent(
location.href
) +
"&text=" +
encodeURIComponent(
text
);

if(TELEGRAM){

TELEGRAM.openTelegramLink(
shareUrl
);

}else{

window.open(
shareUrl,
"_blank"
);

}

};


/* ADMIN BUTTONS */

const editButton =
document.getElementById(
"editButton"
);

const deleteButton =
document.getElementById(
"deleteButton"
);


if(adminCode){

editButton.style.display =
"block";

deleteButton.style.display =
"block";

}else{

editButton.style.display =
"none";

deleteButton.style.display =
"none";

}


editButton.onclick =
()=>editPlace(place);


deleteButton.onclick =
()=>deletePlace(place);


document
.getElementById("card")
.style.display =
"block";

}


function closeCard(){

document
.getElementById("card")
.style.display =
"none";

}


function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   ADD
========================================= */

function openAddPoint(){

editingPlaceId =
null;

document
.getElementById(
"formTitle"
)
.textContent =
"➕ Додати точку на карту";

document
.getElementById(
"saveButton"
)
.textContent =
"✅ Додати точку";

clearForm();

document
.getElementById(
"addModal"
)
.style.display =
"flex";

}


function closeAddPoint(){

document
.getElementById(
"addModal"
)
.style.display =
"none";

cancelPick();

}


function clearForm(){

document
.getElementById(
"newName"
)
.value =
"";

document
.getElementById(
"newAddress"
)
.value =
"";

document
.getElementById(
"newPhone"
)
.value =
"";

document
.getElementById(
"newTelegram"
)
.value =
"";

document
.getElementById(
"newWebsite"
)
.value =
"";

document
.getElementById(
"newLogo"
)
.value =
"";

document
.getElementById(
"addressResults"
)
.style.display =
"none";

document
.getElementById(
"logoPreview"
)
.style.display =
"none";

selectedLat =
null;

selectedLng =
null;

document
.getElementById(
"selectedLocation"
)
.textContent =
"Координати поки не вибрані";

}


/* =========================================
   PICK LOCATION
========================================= */

function startPickLocation(){

document
.getElementById(
"addModal"
)
.style.display =
"none";

document
.getElementById(
"pickMode"
)
.style.display =
"block";

}


function cancelPick(){

document
.getElementById(
"pickMode"
)
.style.display =
"none";

}


function setManualLocation(
latLng
){

selectedLat =
latLng.lat();

selectedLng =
latLng.lng();


if(pickMarker){

pickMarker.setMap(
null
);

}


pickMarker =
new google.maps.Marker({

position:latLng,

map:map,

title:"Нова точка",

draggable:true

});


pickMarker.addListener(
"dragend",
()=>{
const p =
pickMarker.getPosition();

selectedLat =
p.lat();

selectedLng =
p.lng();

updateSelectedLocation();

}
);


updateSelectedLocation();

map.setCenter(
latLng
);

map.setZoom(
17
);

cancelPick();

openAddPointAfterPick();

}


function openAddPointAfterPick(){

document
.getElementById(
"addModal"
)
.style.display =
"flex";

}


function updateSelectedLocation(){

document
.getElementById(
"selectedLocation"
)
.textContent =
"📍 " +
selectedLat.toFixed(6) +
", " +
selectedLng.toFixed(6);

}


/* =========================================
   ADDRESS SEARCH
========================================= */

async function findAddress(){

const address =
document
.getElementById(
"newAddress"
)
.value
.trim();

const box =
document
.getElementById(
"addressResults"
);


if(!address){

alert(
"Введіть адресу."
);

return;

}


box.style.display =
"block";

box.innerHTML =
'<div class="address-loading">🔎 Шукаємо адресу...</div>';


try{

const url =
"https://nominatim.openstreetmap.org/search" +
"?format=jsonv2" +
"&addressdetails=1" +
"&limit=5" +
"&countrycodes=ua" +
"&accept-language=uk" +
"&q=" +
encodeURIComponent(address);


const response =
await fetch(url);


if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}


const results =
await response.json();


if(
!results.length
){

box.innerHTML =
'<div class="address-error">' +
"❌ Адресу не знайдено.<br><br>" +
"Спробуйте: Київ, Хрещатик 1" +
"</div>";

return;

}


box.innerHTML =
"";


results.forEach(
result=>{

const button =
document.createElement(
"button"
);

button.className =
"address-result";

button.type =
"button";

button.textContent =
"📍 " +
result.display_name;

button.onclick =
()=>{
selectAddressResult(
result
);
};

box.appendChild(
button
);

}
);

}catch(error){

console.error(error);

box.innerHTML =
'<div class="address-error">' +
"❌ Помилка пошуку адреси.<br><br>" +
"Спробуйте вибрати місце на карті." +
"</div>";

}

}


function selectAddressResult(
result
){

selectedLat =
parseFloat(
result.lat
);

selectedLng =
parseFloat(
result.lon
);


if(pickMarker){

pickMarker.setMap(
null
);

}


pickMarker =
new google.maps.Marker({

position:{
lat:selectedLat,
lng:selectedLng
},

map:map,

title:
result.display_name,

draggable:true

});


pickMarker.addListener(
"dragend",
()=>{
const p =
pickMarker.getPosition();

selectedLat =
p.lat();

selectedLng =
p.lng();

updateSelectedLocation();

}
);


document
.getElementById(
"newAddress"
)
.value =
result.display_name;


document
.getElementById(
"selectedLocation"
)
.textContent =
"📍 " +
result.display_name;


document
.getElementById(
"addressResults"
)
.style.display =
"none";


map.setCenter({
lat:selectedLat,
lng:selectedLng
});

map.setZoom(
17
);

}


/* =========================================

function previewLogo(event){

const file =
event.target.files[0];

if(!file)return;

const reader =
new FileReader();

reader.onload =
e=>{

const preview =
document.getElementById(
"logoPreview"
);

preview.src =
e.target.result;

preview.style.display =
"block";

};

reader.readAsDataURL(file);

}


/* =========================================
   FILE -> BASE64
========================================= */

function fileToBase64(
file
){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();

reader.onload =
()=>{
resolve(
reader.result
);
};

reader.onerror =
reject;

reader.readAsDataURL(
file
);

}
);

}


/* =========================================

========================================= */

async function savePoint(){

const name =
document
.getElementById(
"newName"
)
.value
.trim();


if(!name){

alert(
"Вкажіть назву точки."
);

return;

}


if(
selectedLat === null ||
selectedLng === null
){

alert(
"Спочатку знайдіть адресу або виберіть місце на карті."
);

return;

}


const category =
document
.getElementById(
"newCategory"
)
.value;


const names = {

manufacturer:
"🏭 Виробник",

shop:
"🏪 Магазин / постачальник",

tools:
"🔧 Інструмент",

gas:
"🔥 Газ",

services:
"🛠 Послуги"

};


const file =
document
.getElementById(
"newLogo"
)
.files[0];


let logoData = "";

let logoType = "";


if(file){

logoData =
await fileToBase64(file);

logoType =
file.type;

}


const place = {

name:name,

category:category,

category_name:
names[category],

address:
document
.getElementById(
"newAddress"
)
.value
.trim(),

phone:
document
.getElementById(
"newPhone"
)
.value
.trim(),

telegram:
document
.getElementById(
"newTelegram"
)
.value
.trim(),

website:
document
.getElementById(
"newWebsite"
)
.value
.trim(),

latitude:
selectedLat,

longitude:
selectedLng

};


try{

if(editingPlaceId){

await apiPost({

action:"update",

code:adminCode,

id:editingPlaceId,

place:{
...place,

...(logoData
?
{
logo_data:logoData,
logo_type:logoType
}
:
{})
}

});


alert(
"Точку оновлено."
);

}else{

await apiPost({

action:"submit",

place:{
...place,

...(logoData
?
{
logo_data:logoData,
logo_type:logoType
}
:
{}),

created_by:
TELEGRAM?.initDataUnsafe?.user?.id
?
String(
TELEGRAM
.initDataUnsafe
.user.id
)
:
"",

created_by_name:
TELEGRAM?.initDataUnsafe?.user?.first_name
||
""

}

});


alert(
adminCode
?
"Точку додано на карту."
:
"Дякуємо! Точка відправлена на модерацію. Після схвалення вона з'явиться на карті."
);

}


closeAddPoint();

await loadPlaces();

}catch(error){

console.error(error);

alert(
"❌ " +
error.message
);

}

}

/* =========================================
   ADMIN
========================================= */

function closeAdmin(){

document
.getElementById(
"adminModal"
)
.style.display =
"none";

}


async function openPending(){

if(!adminCode){

adminLogin();

return;

}


try{

const result =
await apiPost({

action:"pending",

code:adminCode

});

renderPending(
result
);

}catch(error){

alert(
"❌ " +
error.message
);

}

}


function renderPending(list){

const container =
document.getElementById(
"pendingList"
);


if(!list.length){

container.innerHTML =
'<div class="selected-location">' +
"Заявок на модерацію немає." +
"</div>";

return;

}


container.innerHTML =
"";


list.forEach(
place=>{

const item =
document.createElement(
"div"
);

item.className =
"pending-item";


item.innerHTML =

`<div class="pending-name">
${escapeHtml(place.name)}
</div>

<div class="pending-info">
${escapeHtml(place.category_name || "")}<br>
📍 ${escapeHtml(place.address || "")}<br>
📞 ${escapeHtml(place.phone || "")}
</div>`;


const buttons =
document.createElement(
"div"
);

buttons.className =
"buttons";


const approve =
document.createElement(
"button"
);

approve.className =
"button";

approve.textContent =
"✅ Одобрити";


approve.onclick =
async()=>{
await moderate(
"approve",
place.id
);
};


const reject =
document.createElement(
"button"
);

reject.className =
"button red";

reject.textContent =
"❌ Відхилити";


reject.onclick =
async()=>{
await moderate(
"reject",
place.id
);
};


buttons.appendChild(
approve
);

buttons.appendChild(
reject
);

item.appendChild(
buttons
);

container.appendChild(
item
);

}
);

}


async function moderate(
action,
id
){

try{

await apiPost({

action:action,

code:adminCode,

id:id

});


await openPending();

await loadPlaces();

}catch(error){

alert(
"❌ " +
error.message
);

}

}


/* =========================================
   LOCATION
========================================= */

function findMe(){

if(
!navigator.geolocation
){

alert(
"Геолокація не підтримується."
);

return;

}


navigator.geolocation.getCurrentPosition(

position=>{

const location = {

lat:
position.coords.latitude,

lng:
position.coords.longitude

};


map.setCenter(
location
);

map.setZoom(
14
);


if(userMarker){

userMarker.setMap(
null
);

}


userMarker =
new google.maps.Marker({

position:location,

map:map,

title:"Моє місцезнаходження"

});

},

()=>{

alert(
"Не вдалося отримати місцезнаходження."
);

}

);

}
