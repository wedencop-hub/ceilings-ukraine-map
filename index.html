<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Карта натяжних стель України</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
}

.top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  background: rgba(255,255,255,.97);
  padding: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.title {
  font-size: 18px;
  font-weight: 700;
  margin: 2px 4px 8px;
}

.search {
  width: 100%;
  height: 42px;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 0 14px;
  font-size: 16px;
  outline: none;
}

.categories {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 9px 0 2px;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.category {
  flex: 0 0 auto;
  border: 0;
  border-radius: 20px;
  padding: 9px 13px;
  background: #eeeeee;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

.category.active {
  background: #229ed9;
  color: white;
}

#map {
  position: absolute;
  top: 128px;
  bottom: 0;
  left: 0;
  right: 0;
}

.map-actions {
  position: absolute;
  right: 14px;
  bottom: 76px;
  z-index: 15;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.map-action {
  border: 0;
  border-radius: 14px;
  background: white;
  padding: 12px 14px;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 3px 12px rgba(0,0,0,.22);
}

.location-button {
  position: absolute;
  right: 14px;
  bottom: 18px;
  z-index: 15;
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 50%;
  background: white;
  box-shadow: 0 3px 12px rgba(0,0,0,.25);
  font-size: 22px;
}

.card {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 10px;
  z-index: 30;
  background: white;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 4px 25px rgba(0,0,0,.3);
  display: none;
  max-height: 70%;
  overflow-y: auto;
}

.card-logo {
  width: 70px;
  height: 70px;
  border-radius: 14px;
  object-fit: contain;
  background: #f3f3f3;
  margin-bottom: 10px;
}

.card-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
}

.card-info {
  font-size: 14px;
  line-height: 1.55;
  color: #444;
}

.buttons {
  display: grid;
  gap: 8px;
  margin-top: 14px;
}

.button {
  width: 100%;
  border: 0;
  border-radius: 11px;
  padding: 13px;
  font-size: 15px;
  font-weight: 700;
  background: #229ed9;
  color: white;
}

.button.close {
  background: #eeeeee;
  color: #222;
}

.modal {
  position: absolute;
  inset: 0;
  z-index: 50;
  background: rgba(0,0,0,.45);
  display: none;
  align-items: flex-end;
}

.modal-content {
  width: 100%;
  max-height: 92%;
  overflow-y: auto;
  background: white;
  border-radius: 22px 22px 0 0;
  padding: 18px;
}

.modal-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 14px;
}

.form-group {
  margin-bottom: 11px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 5px;
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 11px;
  padding: 12px;
  font-size: 15px;
  outline: none;
}

.form-textarea {
  min-height: 75px;
  resize: none;
}

.logo-preview {
  width: 80px;
  height: 80px;
  border-radius: 14px;
  object-fit: contain;
  background: #f1f1f1;
  display: none;
  margin-top: 8px;
}

.pick-location {
  width: 100%;
  border: 0;
  border-radius: 11px;
  padding: 13px;
  background: #eeeeee;
  font-weight: 700;
  margin-bottom: 8px;
}

.selected-location {
  font-size: 13px;
  color: #555;
  margin-bottom: 10px;
  white-space: normal;
  line-height: 1.4;
}

.address-result {
  width: 100%;
  text-align: left;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: white;
  padding: 11px;
  margin-bottom: 6px;
  font-size: 14px;
  cursor: pointer;
}

.address-result:active {
  background: #eeeeee;
}

.address-loading {
  padding: 10px;
  border-radius: 10px;
  background: #f1f1f1;
  font-size: 14px;
}

.address-error {
  padding: 10px;
  border-radius: 10px;
  background: #fff0f0;
  color: #a00000;
  font-size: 14px;
}

.pick-mode {
  position: absolute;
  top: 140px;
  left: 15px;
  right: 15px;
  z-index: 40;
  background: white;
  border-radius: 14px;
  padding: 14px;
  text-align: center;
  box-shadow: 0 3px 15px rgba(0,0,0,.25);
  display: none;
}

.empty {
  display: none;
  position: absolute;
  top: 145px;
  left: 20px;
  right: 20px;
  z-index: 8;
  background: white;
  border-radius: 14px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 3px 15px rgba(0,0,0,.15);
}
</style>
</head>

<body>

<div id="app">

<div class="top">

<div class="title">
🗺 Карта натяжних стель України
</div>

<input
id="search"
class="search"
type="search"
placeholder="🔍 Пошук міста, компанії..."
>

<div class="categories">

<button class="category active" data-category="all">
Всі
</button>

<button class="category" data-category="manufacturer">
🏭 Виробники
</button>

<button class="category" data-category="shop">
🏪 Магазини
</button>

<button class="category" data-category="tools">
🔧 Інструмент
</button>

<button class="category" data-category="gas">
🔥 Газ
</button>

<button class="category" data-category="services">
🛠 Послуги
</button>

</div>
</div>


<div id="map"></div>


<div class="map-actions">

<button
class="map-action"
onclick="openAddPoint()">
➕ Додати точку
</button>

<button
id="adminMapButton"
class="map-action"
style="display:none;"
onclick="openAdmin()">
👑 Адмін
</button>

</div>


<button
class="location-button"
onclick="findMe()">
◎
</button>


<div id="pickMode" class="pick-mode">

📍 Натисни на потрібне місце на карті

<br><br>

<button
class="button close"
onclick="cancelPick()">
Скасувати
</button>

</div>


<div id="empty" class="empty">
Нічого не знайдено
</div>


<div id="card" class="card">

<img
id="cardLogo"
class="card-logo"
style="display:none">

<div id="cardTitle" class="card-title"></div>

<div id="cardInfo" class="card-info"></div>

<div class="buttons">

<button id="phoneButton" class="button">
📞 ПОЗВОНИТЬ
</button>

<button id="routeButton" class="button">
🧭 ПРОКЛАСТИ МАРШРУТ
</button>

<button id="telegramButton" class="button">
✈️ TELEGRAM
</button>

<button id="websiteButton" class="button">
🌐 САЙТ
</button>

<button id="shareButton" class="button">
↗️ ПОДІЛИТИСЯ ТОЧКОЮ
</button>

<button
id="editButton"
class="button"
style="display:none;background:#666;">
✏️ РЕДАГУВАТИ
</button>

<button
id="deleteButton"
class="button"
style="display:none;background:#d93025;">
🗑 ВИДАЛИТИ ТОЧКУ
</button>

<button
class="button close"
onclick="closeCard()">
Закрити
</button>

</div>
</div>


<div id="addModal" class="modal">

<div class="modal-content">

<div class="modal-title">
➕ Додати точку на карту
</div>


<div class="form-group">

<label class="form-label">
Тип точки
</label>

<select id="newCategory" class="form-select">

<option value="manufacturer">
🏭 Виробник
</option>

<option value="shop">
🏪 Магазин / постачальник
</option>

<option value="tools">
🔧 Інструмент
</option>

<option value="gas">
🔥 Газ
</option>

<option value="services">
🛠 Послуги
</option>

</select>
</div>


<div class="form-group">

<label class="form-label">
Назва
</label>

<input
id="newName"
class="form-input"
placeholder="Наприклад: Alkor Draka">

</div>


<div class="form-group">

<label class="form-label">
Адреса
</label>

<input
id="newAddress"
class="form-input"
placeholder="Місто, вулиця, номер">

<button
type="button"
class="pick-location"
onclick="findAddress()">
🔎 Знайти адресу на карті
</button>

<div
id="addressResults"
style="display:none;margin-top:8px;">
</div>

</div>


<div class="form-group">

<label class="form-label">
Телефон
</label>

<input
id="newPhone"
class="form-input"
type="tel"
placeholder="+380...">

</div>


<div class="form-group">

<label class="form-label">
Telegram
</label>

<input
id="newTelegram"
class="form-input"
placeholder="@username або посилання">

</div>


<div class="form-group">

<label class="form-label">
Сайт
</label>

<input
id="newWebsite"
class="form-input"
placeholder="https://...">

</div>


<div class="form-group">

<label class="form-label">
Логотип / фото
</label>

<input
id="newLogo"
class="form-input"
type="file"
accept="image/*"
onchange="previewLogo(event)">

<img
id="logoPreview"
class="logo-preview">

</div>


<button
class="pick-location"
onclick="startPickLocation()">
📍 Вибрати місце на карті
</button>


<div
id="selectedLocation"
class="selected-location">
Координати поки не вибрані
</div>


<div class="buttons">

<button
class="button"
onclick="savePoint()">
✅ Додати точку
</button>

<button
class="button close"
onclick="closeAddPoint()">
Відміна
</button>

</div>

</div>
</div>


<div id="adminModal" class="modal">

<div class="modal-content">

<div class="modal-title">
👑 Адміністрування
</div>

<div id="adminStatus" class="selected-location">
Режим адміністратора
</div>

<div class="buttons">

<button
class="button"
onclick="openPending()">
⏳ Заявки на модерацію
</button>

<button
class="button close"
onclick="closeAdmin()">
Закрити
</button>

</div>

<div
id="pendingList"
style="margin-top:14px;">
</div>

</div>
</div>

</div>


<script>

const tg =
window.Telegram.WebApp;

tg.ready();
tg.expand();


let map;

let userMarker = null;

let pickMarker = null;

let activeCategory = "all";

let markers = [];

let selectedLat = null;

let selectedLng = null;

let currentPlace = null;

let editingPlaceId = null;


/*
ВАЖНО:

После подключения Telegram-бота сюда будет
поставлен твой реальный Telegram ID.

Пока оставляем заглушку.
*/

const ADMIN_IDS = [
"YOUR_TELEGRAM_ID"
];


let pendingPlaces = [];


try {

pendingPlaces =
JSON.parse(
localStorage.getItem(
"ceilingPendingPlaces"
) || "[]"
);

} catch(e) {

pendingPlaces = [];

}


/* СУЩЕСТВУЮЩИЕ ТОЧКИ */

let places = [

{
name:
"Potolki Everest / EverestComplekt",

category:
"shop",

categoryName:
"🏪 Постачальник",

address:
"вул. Академіка Булаховського, 2/1, Київ",

phone:
"+380 67 393 99 37",

telegram:
"https://t.me/igor_everest",

website:
"",

logo:
"",

lat:
50.4714,

lng:
30.35052

},


{
name:
"GoodHub",

category:
"services",

categoryName:
"🛠 Послуги для монтажників",

address:
"Вишневе, Київська область",

phone:
"",

telegram:
"",

website:
"",

logo:
"",

lat:
50.387,

lng:
30.370

}

];


try {

const saved =
JSON.parse(
localStorage.getItem(
"ceilingPlaces"
) || "[]"
);

places =
places.concat(saved);

} catch(e) {}


/* ИНИЦИАЛИЗАЦИЯ */

function initMap() {

map =
new google.maps.Map(
document.getElementById("map"),
{

center:{
lat:48.5,
lng:31.2
},

zoom:6,

mapTypeControl:false,

streetViewControl:false,

fullscreenControl:false,

gestureHandling:"greedy"

});


map.addListener(
"click",
function(event){

if(
document
.getElementById("pickMode")
.style.display === "block"
){

setManualLocation(
event.latLng
);

}

});


createMarkers();

setupSearch();

setupCategories();

updateAdminButton();

}


/* РУЧНАЯ УСТАНОВКА */

function setManualLocation(
latLng
){

selectedLat =
latLng.lat();

selectedLng =
latLng.lng();


if(pickMarker){

pickMarker.setMap(null);

}


pickMarker =
new google.maps.Marker({

position:latLng,

map:map,

title:"Нова точка",

draggable:true

});


pickMarker.addListener(
"dragend",
function(){

const p =
pickMarker.getPosition();

selectedLat =
p.lat();

selectedLng =
p.lng();


document
.getElementById(
"selectedLocation"
)
.textContent =
"📍 " +
selectedLat.toFixed(6) +
", " +
selectedLng.toFixed(6);

}
);


document
.getElementById(
"selectedLocation"
)
.textContent =
"📍 " +
selectedLat.toFixed(6) +
", " +
selectedLng.toFixed(6);


document
.getElementById(
"pickMode"
)
.style.display =
"none";


map.setCenter(
latLng
);

map.setZoom(
17
);

}


/* МАРКЕРЫ */

function createMarkers(){

markers.forEach(
item=>{
item.marker.setMap(null);
}
);

markers=[];


places.forEach(
place=>{

const marker =
new google.maps.Marker({

position:{
lat:place.lat,
lng:place.lng
},

map:map,

title:place.name

});


marker.addListener(
"click",
()=>{
openCard(place)
}
);


markers.push({
place:place,
marker:marker
});

}
);

}


/* КАТЕГОРИИ */

function setupCategories(){

document
.querySelectorAll(".category")
.forEach(
button=>{

button.addEventListener(
"click",
()=>{

document
.querySelectorAll(
".category"
)
.forEach(
b=>
b.classList.remove(
"active"
)
);


button.classList.add(
"active"
);


activeCategory =
button.dataset.category;


filterPlaces();

}
);

}
);

}


/* ПОИСК ТОЧЕК */

function setupSearch(){

document
.getElementById("search")
.addEventListener(
"input",
filterPlaces
);

}


function filterPlaces(){

const query =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


let visible=0;


markers.forEach(
item=>{

const place =
item.place;


const categoryOK =
activeCategory==="all" ||
place.category===activeCategory;


const searchText =
(
place.name +
" " +
place.address +
" " +
place.categoryName
).toLowerCase();


const searchOK =
!query ||
searchText.includes(query);


if(
categoryOK &&
searchOK
){

item.marker.setMap(map);

visible++;

}else{

item.marker.setMap(null);

}

}
);


document
.getElementById("empty")
.style.display =
visible===0
?"block"
:"none";

}


/* КАРТОЧКА */

function openCard(place){

currentPlace =
place;


document
.getElementById(
"cardTitle"
)
.textContent =
place.name;


document
.getElementById(
"cardInfo"
)
.innerHTML =

`<b>${place.categoryName}</b><br>
📍 ${place.address}`;


const logo =
document.getElementById(
"cardLogo"
);


if(place.logo){

logo.src =
place.logo;

logo.style.display =
"block";

}else{

logo.style.display =
"none";

}


const phoneButton =
document.getElementById(
"phoneButton"
);


if(place.phone){

phoneButton.style.display =
"block";

phoneButton.onclick =
()=>{
window.location.href =
"tel:"+place.phone;
};

}else{

phoneButton.style.display =
"none";

}


document
.getElementById(
"routeButton"
)
.onclick =
()=>{

const url =
"https://www.google.com/maps/dir/?api=1" +
"&destination=" +
place.lat +
"," +
place.lng;


tg.openLink(url);

};


const telegramButton =
document.getElementById(
"telegramButton"
);


if(place.telegram){

telegramButton.style.display =
"block";

telegramButton.onclick =
()=>{

let link =
place.telegram;


if(
!link.startsWith("http")
){

link =
"https://t.me/" +
link.replace("@","");

}


tg.openLink(link);

};

}else{

telegramButton.style.display =
"none";

}


const websiteButton =
document.getElementById(
"websiteButton"
);


if(place.website){

websiteButton.style.display =
"block";

websiteButton.onclick =
()=>{
tg.openLink(
place.website
);
};

}else{

websiteButton.style.display =
"none";

}


document
.getElementById(
"shareButton"
)
.onclick =
()=>{

const text =
"📍 " +
place.name +
"\n" +
place.address +
"\n\n" +
"🗺 Карта натяжних стель України";


const shareUrl =
"https://t.me/share/url?url=" +
encodeURIComponent(
"https://wedencop-hub.github.io/ceilings-ukraine-map/"
) +
"&text=" +
encodeURIComponent(text);


tg.openTelegramLink(
shareUrl
);

};


const editButton =
document.getElementById(
"editButton"
);


const deleteButton =
document.getElementById(
"deleteButton"
);


editButton.style.display =
isAdmin()
?"block"
:"none";


deleteButton.style.display =
isAdmin()
?"block"
:"none";


if(isAdmin()){

editButton.onclick =
()=>{
editPlace(place);
};


deleteButton.onclick =
()=>{
deletePlace(place);
};

}


document
.getElementById("card")
.style.display =
"block";

}


function closeCard(){

document
.getElementById("card")
.style.display =
"none";

}


/* ДОБАВЛЕНИЕ */

function openAddPoint(){

editingPlaceId =
null;

document
.getElementById(
"addModal"
)
.style.display =
"flex";

}


function closeAddPoint(){

document
.getElementById(
"addModal"
)
.style.display =
"none";


cancelPick();

}


function startPickLocation(){

document
.getElementById(
"addModal"
)
.style.display =
"none";


document
.getElementById(
"pickMode"
)
.style.display =
"block";

}


function cancelPick(){

document
.getElementById(
"pickMode"
)
.style.display =
"none";

}


/* ЛОГОТИП */

function previewLogo(event){

const file =
event.target.files[0];


if(!file)return;


const reader =
new FileReader();


reader.onload =
function(e){

const preview =
document.getElementById(
"logoPreview"
);


preview.src =
e.target.result;


preview.style.display =
"block";

};


reader.readAsDataURL(
file
);

}


/* ПОИСК АДРЕСА */

async function findAddress(){

const addressInput =
document.getElementById(
"newAddress"
);


const resultsBox =
document.getElementById(
"addressResults"
);


const address =
addressInput.value.trim();


if(!address){

tg.showAlert(
"Введіть адресу."
);

return;

}


resultsBox.style.display =
"block";


resultsBox.innerHTML =
'<div class="address-loading">' +
'🔎 Шукаємо адресу...' +
'</div>';


try{

const url =
"https://nominatim.openstreetmap.org/search" +
"?format=jsonv2" +
"&addressdetails=1" +
"&limit=5" +
"&countrycodes=ua" +
"&accept-language=uk" +
"&q=" +
encodeURIComponent(address);


const response =
await fetch(
url,
{
method:"GET",
headers:{
"Accept":
"application/json"
}
}
);


if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}


const results =
await response.json();


if(
!results ||
!results.length
){

resultsBox.innerHTML =

'<div class="address-error">' +

'❌ Адресу не знайдено.<br><br>' +

'<small>' +

'Спробуйте написати:<br>' +

'Київ, Хрещатик 1<br>' +

'Київ, вул. Хрещатик, 1<br>' +

'Вишневе, Київська область' +

'</small>' +

'</div>';

return;

}


resultsBox.innerHTML =
"";


results.forEach(
result=>{

const button =
document.createElement(
"button"
);


button.type =
"button";


button.className =
"address-result";


button.textContent =
"📍 " +
result.display_name;


button.onclick =
()=>{
selectAddressResult(
result
);
};


resultsBox.appendChild(
button
);

}
);


}catch(error){

console.error(
"Address search:",
error
);


resultsBox.innerHTML =

'<div class="address-error">' +

'❌ Не вдалося виконати пошук адреси.<br><br>' +

'Скористайтеся «Вибрати місце на карті».' +

'</div>';

}

}


/* ВЫБОР АДРЕСА */

function selectAddressResult(
result
){

const lat =
parseFloat(
result.lat
);


const lng =
parseFloat(
result.lon
);


selectedLat =
lat;


selectedLng =
lng;


if(pickMarker){

pickMarker.setMap(
null
);

}


pickMarker =
new google.maps.Marker({

position:{
lat:lat,
lng:lng
},

map:map,

title:
result.display_name,

draggable:true

});


pickMarker.addListener(
"dragend",
function(){

const p =
pickMarker.getPosition();


selectedLat =
p.lat();

selectedLng =
p.lng();


document
.getElementById(
"selectedLocation"
)
.textContent =
"📍 " +
selectedLat.toFixed(6) +
", " +
selectedLng.toFixed(6);

}
);


map.setCenter({
lat:lat,
lng:lng
});


map.setZoom(
17
);


document
.getElementById(
"newAddress"
)
.value =
result.display_name;


document
.getElementById(
"selectedLocation"
)
.textContent =
"📍 " +
result.display_name +
" (" +
lat.toFixed(6) +
", " +
lng.toFixed(6) +
")";


document
.getElementById(
"addressResults"
)
.style.display =
"none";

}


/* СОХРАНЕНИЕ */

function savePoint(){

const name =
document
.getElementById(
"newName"
)
.value
.trim();


if(!name){

tg.showAlert(
"Вкажіть назву точки."
);

return;

}


if(
selectedLat===null ||
selectedLng===null
){

tg.showAlert(
"Спочатку знайдіть адресу або виберіть місце на карті."
);

return;

}


const category =
document
.getElementById(
"newCategory"
)
.value;


const categoryNames = {

manufacturer:
"🏭 Виробник",

shop:
"🏪 Магазин / постачальник",

tools:
"🔧 Інструмент",

gas:
"🔥 Газ",

services:
"🛠 Послуги"

};


const logo =
document
.getElementById(
"logoPreview"
)
.src || "";


const newPlace = {

id:
"place_" +
Date.now() +
"_" +
Math.random()
.toString(36)
.slice(2),

name:name,

category:category,

categoryName:
categoryNames[category],

address:
document
.getElementById(
"newAddress"
)
.value
.trim(),

phone:
document
.getElementById(
"newPhone"
)
.value
.trim(),

telegram:
document
.getElementById(
"newTelegram"
)
.value
.trim(),

website:
document
.getElementById(
"newWebsite"
)
.value
.trim(),

logo:logo,

lat:selectedLat,

lng:selectedLng,

status:"pending",

submittedAt:
new Date()
.toISOString()

};


/* РЕДАКТИРОВАНИЕ */

if(
isAdmin() &&
editingPlaceId
){

const index =
places.findIndex(
p=>
p.id===editingPlaceId
);


if(index>=0){

newPlace.id =
editingPlaceId;

newPlace.status =
"approved";

places[index] =
newPlace;

savePlaces();

createMarkers();

editingPlaceId =
null;

closeAddPoint();

tg.showAlert(
"Точку оновлено."
);

return;

}

}


/* АДМИНИСТРАТОР */

if(isAdmin()){

newPlace.status =
"approved";

places.push(
newPlace
);

savePlaces();

createMarkers();

closeAddPoint();

map.setCenter({

lat:selectedLat,

lng:selectedLng

});

map.setZoom(
14
);

tg.showAlert(
"Точку додано на карту."
);

return;

}


/* ОБЫЧНЫЙ ПОЛЬЗОВАТЕЛЬ */

pendingPlaces.push(
newPlace
);

savePendingPlaces();

closeAddPoint();

tg.showAlert(
"Дякуємо! Точка відправлена на модерацію. Вона з'явиться на карті після схвалення."
);

}


/* СОХРАНЕНИЕ */

function savePlaces(){

const customPlaces =
places.filter(
p=>
p.id ||
!(
p.name ===
"Potolki Everest / EverestComplekt" ||
p.name ===
"GoodHub"
)
);


localStorage.setItem(
"ceilingPlaces",
JSON.stringify(
customPlaces
)
);

}


function savePendingPlaces(){

localStorage.setItem(
"ceilingPendingPlaces",
JSON.stringify(
pendingPlaces
)
);

}


/* АДМИН */

function isAdmin(){

const userId =
tg &&
tg.initDataUnsafe &&
tg.initDataUnsafe.user
?
String(
tg.initDataUnsafe.user.id
)
:
"";


return ADMIN_IDS.includes(
userId
);

}


function updateAdminButton(){

const button =
document.getElementById(
"adminMapButton"
);


if(button){

button.style.display =
isAdmin()
?"block"
:"none";

}

}


/* РЕДАКТИРОВАНИЕ */

function editPlace(place){

closeCard();


document.getElementById(
"newCategory"
).value =
place.category;


document.getElementById(
"newName"
).value =
place.name;


document.getElementById(
"newAddress"
).value =
place.address || "";


document.getElementById(
"newPhone"
).value =
place.phone || "";


document.getElementById(
"newTelegram"
).value =
place.telegram || "";


document.getElementById(
"newWebsite"
).value =
place.website || "";


selectedLat =
place.lat;


selectedLng =
place.lng;


editingPlaceId =
place.id;


openAddPoint();


document.getElementById(
"selectedLocation"
).textContent =
"📍 " +
place.lat.toFixed(6) +
", " +
place.lng.toFixed(6);

}


/* УДАЛЕНИЕ */

function deletePlace(place){

if(
!confirm(
"Видалити точку «" +
place.name +
"» з карти?"
)
){

return;

}


places =
places.filter(
p=>
p!==place
);


savePlaces();

createMarkers();

closeCard();

tg.showAlert(
"Точку видалено."
);

}


/* АДМИН-ПАНЕЛЬ */

function openAdmin(){

if(!isAdmin()){

tg.showAlert(
"Доступ тільки для адміністратора."
);

return;

}


document
.getElementById(
"adminModal"
)
.style.display =
"flex";


openPending();

}


function closeAdmin(){

document
.getElementById(
"adminModal"
)
.style.display =
"none";

}


/* ЗАЯВКИ */

function openPending(){

const list =
document.getElementById(
"pendingList"
);


if(!pendingPlaces.length){

list.innerHTML =
'<div class="selected-location">' +
"Нових заявок немає." +
"</div>";

return;

}


list.innerHTML =
"";


pendingPlaces.forEach(
place=>{

const item =
document.createElement(
"div"
);


item.style =
"border:1px solid #ddd;" +
"border-radius:12px;" +
"padding:12px;" +
"margin-bottom:10px;";


item.innerHTML =

"<b>" +
place.name +
"</b><br>" +

place.categoryName +
"<br>" +

"📍 " +
place.address +
"<br>" +

"📞 " +
(place.phone || "—");


const buttons =
document.createElement(
"div"
);


buttons.className =
"buttons";


buttons.innerHTML =

'<button class="button">' +
"✅ Одобрити" +
"</button>" +

'<button class="button" style="background:#d93025;">' +
"❌ Відхилити" +
"</button>";


buttons.children[0].onclick =
()=>{
approvePlace(
place.id
);
};


buttons.children[1].onclick =
()=>{
rejectPlace(
place.id
);
};


item.appendChild(
buttons
);


list.appendChild(
item
);

}
);

}


function approvePlace(id){

const index =
pendingPlaces.findIndex(
p=>
p.id===id
);


if(index<0)return;


const place =
pendingPlaces[index];


place.status =
"approved";


places.push(
place
);


pendingPlaces.splice(
index,
1
);


savePlaces();

savePendingPlaces();

createMarkers();

openPending();

tg.showAlert(
"Точку схвалено."
);

}


function rejectPlace(id){

pendingPlaces =
pendingPlaces.filter(
p=>
p.id!==id
);


savePendingPlaces();

openPending();

tg.showAlert(
"Заявку відхилено."
);

}


/* МОЁ МЕСТОПОЛОЖЕНИЕ */

function findMe(){

if(
!navigator.geolocation
){

tg.showAlert(
"Ваш браузер не підтримує геолокацію."
);

return;

}


navigator.geolocation.getCurrentPosition(

position=>{

const location = {

lat:
position.coords.latitude,

lng:
position.coords.longitude

};


map.setCenter(
location
);


map.setZoom(
13
);


if(userMarker){

userMarker.setMap(
null
);

}


userMarker =
new google.maps.Marker({

position:location,

map:map,

title:
"Моє місцезнаходження"

});

},


()=>{

tg.showAlert(
"Не вдалося отримати ваше місцезнаходження."
);

}

);

}

</script>

src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD8juKXcYCwBIqfLzQFW4qVApkKxosmQFw&callback=initMap">
</script>
