<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Карта натяжних стель України</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#081018;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

#app{
  position:relative;
  width:100%;
  height:100%;
}

/* =========================
   GOOGLE MAP
========================= */

#map{
  position:absolute;
  inset:0;
  z-index:1;
  background:#15202b;
}

.marker-rating{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;

  min-width:58px;
  height:34px;

  padding:0 10px;

  background:#fff;
  color:#111;

  border:2px solid rgba(0,0,0,.15);
  border-radius:20px;

  box-shadow:0 4px 14px rgba(0,0,0,.4);

  font-size:13px;
  font-weight:800;

  white-space:nowrap;
}

.marker-rating .star{
  color:#f5b900;
  font-size:15px;
}

/* CUSTOM LOGO + RATING MAP MARKERS */
.custom-map-marker{
  position:absolute;
  transform:translate(-50%,-100%);
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 8px 5px 5px;
  background:rgba(255,255,255,.98);
  color:#111;
  border:2px solid rgba(0,0,0,.18);
  border-radius:22px;
  box-shadow:0 4px 14px rgba(0,0,0,.42);
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}
.custom-map-marker::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-7px;
  width:12px;
  height:12px;
  background:#fff;
  transform:translateX(-50%) rotate(45deg);
  border-right:2px solid rgba(0,0,0,.12);
  border-bottom:2px solid rgba(0,0,0,.12);
  z-index:-1;
}
.custom-map-marker .marker-logo{
  width:34px;
  height:34px;
  object-fit:cover;
  border-radius:50%;
  background:#f1f3f5;
  border:2px solid #fff;
  box-shadow:0 1px 5px rgba(0,0,0,.2);
}
.custom-map-marker .marker-logo-fallback{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#087cf5;
  color:#fff;
  font-size:18px;
}
.custom-map-marker .marker-rating-text{
  display:flex;
  align-items:center;
  gap:3px;
  line-height:1;
}
.custom-map-marker .marker-star{
  color:#f5b900;
  font-size:20px;
}

.custom-map-marker .gas-marker-logo{
  background:#fff3e0;
  color:#ff6d00;
  font-size:21px;
}

/* =========================
   TOP
========================= */

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;

  z-index:1000;

  padding:9px;

  background:rgba(8,14,20,.94);

  backdrop-filter:blur(18px);

  box-shadow:0 2px 18px rgba(0,0,0,.4);
}

.header{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.title{
  flex:1;
  font-size:17px;
  font-weight:800;
}

.top-btn{
  height:39px;
  padding:0 12px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:11px;

  background:#141f2a;
  color:#fff;

  font-size:13px;
  font-weight:800;
}

.top-btn.blue{
  background:#087cf5;
  border-color:#087cf5;
}

.search-row{
  display:flex;
  gap:7px;
}

.search{
  flex:1;

  height:43px;

  padding:0 13px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:12px;

  outline:none;

  background:#121c26;
  color:#fff;

  font-size:14px;
}

.search::placeholder{
  color:#778594;
}

.filter-btn{
  width:45px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:12px;

  background:#121c26;
  color:#fff;

  font-size:19px;
}

/* =========================
   CATEGORIES
========================= */

.categories{
  display:flex;
  gap:7px;
  padding-top:8px;

  overflow-x:auto;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:0 0 auto;

  height:36px;
  padding:0 13px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;

  background:#131e28;
  color:#fff;

  font-size:12px;
  font-weight:800;
}

.category.active{
  background:#087cf5;
  border-color:#087cf5;
}

/* =========================
   MAP BUTTONS
========================= */

.map-buttons{
  position:absolute;

  right:12px;
  bottom:115px;

  z-index:900;

  display:flex;
  flex-direction:column;
  gap:8px;
}

.map-button,
.map-type-button{
  width:47px;
  height:47px;

  border:1px solid rgba(255,255,255,.14);
  border-radius:13px;

  background:#121c26;
  color:#fff;

  font-size:23px;

  box-shadow:0 4px 16px rgba(0,0,0,.35);
}

.map-type-button{
  font-size:20px;
}

.my-location{
  position:absolute;

  left:14px;
  bottom:115px;

  z-index:900;

  width:49px;
  height:49px;

  border:0;
  border-radius:50%;

  background:#087cf5;
  color:#fff;

  font-size:24px;

  box-shadow:0 4px 18px rgba(0,0,0,.4);
}

/* =========================
   CARD
========================= */

.card{
  position:absolute;

  left:8px;
  right:8px;
  bottom:8px;

  z-index:1200;

  display:none;

  max-height:82%;
  overflow-y:auto;

  background:#0d151e;

  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;

  box-shadow:0 -10px 40px rgba(0,0,0,.55);
}

.card-handle{
  width:40px;
  height:5px;

  margin:9px auto;

  border-radius:5px;

  background:#667582;
}

.card-close{
  position:absolute;

  top:10px;
  right:12px;

  z-index:10;

  width:38px;
  height:38px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:50%;

  background:rgba(0,0,0,.45);
  color:#fff;

  font-size:23px;
}

.card-main{
  padding:5px 17px 0;
}

.card-image{
  display:none;

  width:100%;
  height:210px;

  object-fit:cover;

  margin-bottom:12px;

  border-radius:15px;

  background:#17222c;
}

.card-name{
  padding-right:45px;

  font-size:23px;
  font-weight:800;
  line-height:1.18;
}

.rating-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;

  gap:7px;

  margin-top:8px;
  margin-bottom:13px;
}

.rating-number{
  font-size:20px;
  font-weight:800;
}

.stars{
  color:#ffc400;
  letter-spacing:1px;
}

.review-count{
  color:#aab5c0;
  font-size:13px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.action{
  height:41px;
  padding:0 14px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:21px;

  background:#141f29;
  color:#fff;

  font-size:13px;
  font-weight:800;
}

.action.primary{
  background:#087cf5;
  border-color:#087cf5;
}

.action.danger{
  background:#d7353d;
  border-color:#d7353d;
}

.info{
  margin:15px 17px 0;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.11);
  border-radius:14px;
}

.info-row{
  display:flex;
  gap:10px;

  padding:12px;

  border-bottom:1px solid rgba(255,255,255,.07);

  font-size:14px;
}

.info-row:last-child{
  border-bottom:0;
}

.info-icon{
  width:22px;
}

.info-value{
  flex:1;
  word-break:break-word;
  color:#d5dce3;
}

.info-value a{
  color:#48afff;
  text-decoration:none;
}

.description{
  padding:15px 17px;

  color:#c8d1da;

  font-size:14px;
  line-height:1.5;
}

/* =========================
   REVIEWS
========================= */

.review-title{
  padding:3px 17px 9px;

  font-size:19px;
  font-weight:800;
}

.reviews{
  display:flex;
  gap:9px;

  padding:0 17px 15px;

  overflow-x:auto;
  scrollbar-width:none;
}

.reviews::-webkit-scrollbar{
  display:none;
}

.review{
  flex:0 0 270px;

  padding:13px;

  background:#121c26;

  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
}

.review-author{
  font-weight:800;
}

.review-date{
  margin-top:3px;

  color:#788592;
  font-size:11px;
}

.review-stars{
  margin:8px 0;
  color:#ffc400;
}

.review-text{
  color:#cbd3dc;

  font-size:13px;
  line-height:1.45;
}

.review-form{
  margin:0 17px 17px;
  padding:14px;

  background:#121c26;

  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
}

.review-form-title{
  margin-bottom:8px;

  font-size:17px;
  font-weight:800;
}

.star-select{
  display:flex;
  gap:3px;
  margin-bottom:9px;
}

.star-select button{
  padding:0;

  border:0;
  background:none;

  color:#66727f;

  font-size:30px;
}

.star-select button.active{
  color:#ffc400;
}

/* =========================
   MODALS
========================= */

.modal{
  position:absolute;
  inset:0;

  z-index:2000;

  display:none;
  align-items:flex-end;

  background:rgba(0,0,0,.72);
}

.modal-box{
  position:relative;

  width:100%;
  max-height:94%;

  overflow-y:auto;

  padding:18px;

  background:#0d151e;

  border-radius:22px 22px 0 0;
}

.modal-title{
  margin-bottom:15px;

  font-size:21px;
  font-weight:800;
}

.group{
  margin-bottom:11px;
}

.label{
  display:block;

  margin-bottom:5px;

  color:#aeb8c2;

  font-size:13px;
  font-weight:700;
}

.input,
.select,
.textarea{
  caret-color:#ffffff;
  -webkit-text-fill-color:#ffffff;

  width:100%;

  padding:12px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:10px;

  outline:none;

  background:#101923;
  color:#fff;

  font-size:15px;
}

.textarea{
  min-height:90px;
  resize:vertical;
}

.modal-button{
  width:100%;
  height:45px;

  margin-top:7px;

  border:0;
  border-radius:11px;

  background:#087cf5;
  color:#fff;

  font-size:15px;
  font-weight:800;
}

.modal-button.gray{
  background:#293540;
}

/* ADD_MODAL_CLOSE_ICON_V1 */
#addModal .modal-button.gray{
  position:absolute;
  top:10px;
  right:12px;
  z-index:10;
  width:38px;
  height:38px;
  margin:0;
  padding:0;
  border:1px solid rgba(255,255,255,.13);
  border-radius:50%;
  background:rgba(0,0,0,.45);
  color:#fff;
  font-size:0;
}

#addModal .modal-button.gray::after{
  content:"×";
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  color:#fff;
  font-size:23px;
  font-weight:400;
  line-height:1;
}

.modal-button.red{
  background:#d7353d;
}


.coords{
  padding:7px 0;

  color:#8c99a6;
  font-size:12px;
}

/* =========================
   ADMIN
========================= */

.pending{
  padding:12px;
  margin-bottom:9px;

  border:1px solid rgba(255,255,255,.11);
  border-radius:12px;

  background:#121c26;
}

.pending-name{
  margin-bottom:5px;

  font-size:17px;
  font-weight:800;
}

.pending-info{
  color:#aeb8c2;

  font-size:13px;
  line-height:1.5;
}

.pending-actions{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.pending-actions button{
  flex:1;
}

.admin-item{
  padding:12px;
  margin-bottom:8px;

  border:1px solid rgba(255,255,255,.1);
  border-radius:11px;

  background:#121c26;
}

.admin-name{
  font-weight:800;
}

.admin-meta{
  margin-top:4px;

  color:#9da9b5;
  font-size:12px;
}

.empty{
  position:absolute;

  top:160px;
  left:15px;
  right:15px;

  z-index:500;

  display:none;

  padding:13px;

  border-radius:12px;

  background:#121c26;

  text-align:center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .top{
    padding:8px;
  }

  .title{
    font-size:16px;
  }

  .top-btn{
    height:36px;
    padding:0 9px;
    font-size:12px;
  }

  .card{
    left:0;
    right:0;
    bottom:0;

    max-height:89%;

    border-radius:21px 21px 0 0;
  }

  .card-main{
    padding:5px 12px 0;
  }

  .card-image{
    height:205px;
  }

  .card-name{
    margin-top:9px;
    font-size:21px;
  }

  .info{
    margin-left:12px;
    margin-right:12px;
  }

  .description{
    padding-left:12px;
    padding-right:12px;
  }

  .review-title{
    padding-left:12px;
  }

  .reviews{
    padding-left:12px;
  }

  .review-form{
    margin-left:12px;
    margin-right:12px;
  }

  .map-buttons{
    bottom:125px;
  }

  .my-location{
    bottom:125px;
  }

}

.rating-only-note{margin:0 0 8px;color:#9eabb7;font-size:12px;line-height:1.35;}
.review-delete{margin-top:10px;border:0;border-radius:9px;padding:8px 10px;background:#d7353d;color:#fff;font-size:12px;font-weight:800;}
</style>
<script src="map-protection.js?v=2"></script>

<style>
/* ADD_POINT_MAP_ONLY_V1 */
</style>

<body>
<!-- SEPARATE_RATING_REVIEW_V2 -->

<div id="app">

  <div class="top">

    <div class="header">

      <div class="title">
        🇺🇦 Карта натяжних стель
      </div>

      <button
        id="addButton"
        class="top-btn blue"
        onclick="openAdd()">
        ＋ Додати
      </button>

      <button
        id="adminButton"
        class="top-btn"
        onclick="openAdmin()"
        style="display:none">
        👑 Адмін
      </button>

    </div>

    <div class="search-row">

      <input
        id="search"
        class="search"
        placeholder="🔍 Пошук компанії, міста, адреси"
      >

      <button
        class="filter-btn"
        onclick="toggleCategories()">
        ☷
      </button>

    </div>

    <div
      id="categories"
      class="categories">

      <button
        class="category active"
        data-cat="all">
        ▦ Всі
      </button>

      <button
        class="category"
        data-cat="manufacturer">
        🏭 Виробники
      </button>

      <button
        class="category"
        data-cat="shop">
        🏪 Магазини
      </button>
<button
        class="category"
        data-cat="gas">
        🔥 Газ
      </button>

      <button
        class="category"
        data-cat="services">
        🛠 Послуги
      </button>

    </div>

  </div>

  <div id="map"></div>

  <div class="map-buttons">

    <button
      class="map-button"
      onclick="zoomIn()">
      ＋
    </button>

    <button
      class="map-button"
      onclick="zoomOut()">
      −
    </button>
</div>

  <button
    class="my-location"
    onclick="findMe()">
    ◎
  </button>

  <div
    id="empty"
    class="empty">
    Нічого не знайдено
  </div>

  <div
    id="card"
    class="card">

    <div class="card-handle"></div>

    <button
      class="card-close"
      onclick="closeCard()">
      ×
    </button>

    <div class="card-main">

      <img
        id="cardImage"
        class="card-image"
      >

      <div
        id="cardName"
        class="card-name">
      </div>

      <div class="rating-row">

        <span
          id="cardRating"
          class="rating-number">
        </span>

        <span
          id="cardStars"
          class="stars">
        </span>

        <span
          id="cardReviews"
          class="review-count">
        </span>

      </div>

      <div class="actions">

        <button
          id="routeButton"
          class="action primary">
          ➤ Маршрут
        </button>

        <button
          id="phoneButton"
          class="action">
          ☎ Дзвінок
        </button>

        <button
          id="siteButton"
          class="action">
          🌐 Сайт
        </button>

        <button
          id="telegramButton"
          class="action">
          ✈️ Telegram
        </button>

      </div>

    </div>

    <div
      id="placeInfo"
      class="info">
    </div>

    <div
      id="placeDescription"
      class="description"
      style="display:none">
    </div>

    <div class="review-title">
      Відгуки
    </div>

    <div
      id="reviews"
      class="reviews">
    </div>

    <div class="review-form">

      <div class="review-form-title">
        ⭐ Ваша оцінка
      </div>

      <div
        id="starSelect"
        class="star-select">

        <button data-star="1">☆</button>
        <button data-star="2">☆</button>
        <button data-star="3">☆</button>
        <button data-star="4">☆</button>
        <button data-star="5">☆</button>

      </div>

      <button
        id="sendRatingButton"
        class="modal-button"
        onclick="sendRating()">
        ⭐ Поставити оцінку
      </button>

















































































      <div class="review-form-title" style="margin-top:14px">💬 Написати відгук</div>

      <input
        id="reviewName"
        class="input"
        placeholder="Ваше ім'я"
      >

      <textarea
        id="reviewText"
        class="textarea"
        placeholder="Ваш відгук..."
      ></textarea>

      <button
        class="modal-button"
        onclick="sendReview()">
        Надіслати відгук
      </button>

    </div>

    <div
      id="adminPlaceActions"
      style="display:none;padding:0 17px 17px">

      <div class="actions">

        <button
          class="action"
          onclick="editPlace()">
          ✏️ Редагувати
        </button>

        <button
          class="action danger"
          onclick="deletePlace()">
          🗑 Видалити
        </button>

      </div>

    </div>

  </div>

  <!-- ADD PLACE -->

  <div
    id="addModal"
    class="modal">

    <div class="modal-box">

      <div
        id="addTitle"
        class="modal-title">
        ➕ Додати точку
      </div>

      <div class="group">

        <label class="label">
          Тип точки
        </label>

        <select
          id="newCategory"
          class="select">

          <option value="manufacturer">
            🏭 Виробник
          </option>

          <option value="shop">
            🏪 Магазин / постачальник
          </option>

          <option value="tools">
            🔧 Інструмент
          </option>

          <option value="gas">
            🔥 Газ
          </option>

          <option value="services">
            🛠 Послуги
          </option>

        </select>

      </div>

      <div class="group">

        <label class="label">
          Назва
        </label>

        <input
          id="newName"
          class="input"
          placeholder="Назва компанії">

      </div>

      <div class="group">

      </div>

      <div class="group">

        <label class="label">
          Телефон
        </label>

        <input
          id="newPhone"
          class="input"
          type="tel"
          placeholder="+380...">

      </div>

      <div class="group">

        <label class="label">
          Telegram
        </label>

        <input
          id="newTelegram"
          class="input"
          placeholder="@username або посилання">

      </div>

      <div class="group">

        <label class="label">
          Сайт
        </label>

        <input
          id="newWebsite"
          class="input"
          placeholder="https://...">

      </div>

      <div class="group">

        <label class="label">
          Опис
        </label>

        <textarea
          id="newDescription"
          class="textarea"
          placeholder="Короткий опис компанії..."></textarea>

      </div>

      <div class="group">

        <label class="label">
          Фото / логотип
        </label>

        <input

class LogoRatingOverlay{
  constructor(position,place,clickHandler){
    this.position=position;
    this.place=place;
    this.clickHandler=clickHandler;
    this.div=null;
    this.overlay=new google.maps.OverlayView();
    const self=this;
    this.overlay.onAdd=function(){
      const div=document.createElement("div");
      div.className="custom-map-marker";
      div.setAttribute("role","button");
      div.setAttribute("aria-label",self.place.name||"Point");
      const category=String(self.place.category||"");
      const isGas=category==="gas";
      const logo=isGas
        ? `<div class="marker-logo-fallback gas-marker-logo">🔥</div>`
        : self.place.logo_url
          ? `<img class="marker-logo" src="${escapeAttribute(self.place.logo_url)}" alt="">`
          : `<div class="marker-logo-fallback">+</div>`;
      const rating=Number(self.place.rating||0);
      const ratingText=rating>0?rating.toFixed(1):"-";
      div.innerHTML=logo+`<span class="marker-rating-text"><span class="marker-star">*</span>${ratingText}</span>`;
      div.addEventListener("click",self.clickHandler);
      div.addEventListener("touchend",event=>{event.preventDefault();self.clickHandler(event);},{passive:false});
      self.div=div;
      self.overlay.getPanes().overlayMouseTarget.appendChild(div);
    };
    this.overlay.draw=function(){
      if(!self.div)return;
      const projection=self.overlay.getProjection();
      const point=projection.fromLatLngToDivPixel(self.position);
      if(!point)return;
      self.div.style.left=point.x+"px";
      self.div.style.top=point.y+"px";
    };
    this.overlay.onRemove=function(){
      if(self.div){self.div.remove();self.div=null;}
    };
  }
  setMap(value){
    this.overlay.setMap(value);
  }
}
function renderMarkers(){

  if(!map){

    return;

  }

  places.forEach(
    place=>{

      if(
        place.__marker
      ){

        place.__marker.setMap(
          null
        );

      }

    }
  );

  const searchElement =
    document.getElementById(
      "search"
    );

  const query =
    searchElement
      ? searchElement.value.trim().toLowerCase()
      : "";

  let visible = 0;

  places.forEach(
    place=>{

      const lat =
        Number(
          place.latitude ??
          place.lat
        );

      const lng =
        Number(
          place.longitude ??
          place.lng
        );

      if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ){

        return;

      }

      const category =
        String(
          place.category ||
          ""
        );

      const categoryOK =
        activeCategory ===
          "all" ||
        category ===
          activeCategory;

      const searchable =
        (
          String(
            place.name ||
            ""
          ) +
          " " +
          String(
            place.address ||
            ""
          ) +
          " " +
          String(
            place.city ||
            ""
          )
        )
        .toLowerCase();

      const searchOK =
        !query ||
        searchable.includes(
          query
        );

      if(
        !categoryOK ||
        !searchOK
      ){

        return;

      }

      visible++;

      const rating =
        Number(
          place.rating ||
          0
        );

      const marker =
        new LogoRatingOverlay(
          new google.maps.LatLng(lat,lng),
          place,
          function(){
            openPlace(place);
          }
        );

      marker.setMap(map);

      place.__marker =
        marker;

    }
  );

  document
    .getElementById(
      "empty"
    )
    .style.display =
      visible
        ? "none"
        : "block";

}

async function sendReview(){

  if(!currentPlace){ return; }

  const name = document.getElementById("reviewName").value.trim();
  const text = document.getElementById("reviewText").value.trim();

  if(!name){
    alert("Для відгуку потрібно вказати ім'я.");
    return;
  }

  if(!text){
    alert("Напишіть текст відгуку.");
    return;
  }

  try{
    await api({
      action:"add_review",
      place_id:currentPlace.id,
      author_name:name,
      review_text:text
    });

    document.getElementById("reviewName").value="";
    document.getElementById("reviewText").value="";

    alert("Дякуємо за відгук!");
    await loadPlaces();
    const updated=places.find(item=>String(item.id)===String(currentPlace.id));
    if(updated) await openPlace(updated);
  }catch(error){
    alert("❌ "+error.message);
  }
}

async function sendRating(){

  if(!currentPlace){ return; }

  if(!selectedRating){
    alert("Оберіть кількість зірок.");
    return;
  }

  try{
    await api({
      action:"add_rating",
      place_id:currentPlace.id,
      rating:selectedRating
    });

    selectedRating=0;
    document.querySelectorAll("#starSelect button").forEach(button=>{
      button.textContent="☆";
      button.classList.remove("active");
    });

    alert("Оцінку збережено ⭐");
    await loadPlaces();
    const updated=places.find(item=>String(item.id)===String(currentPlace.id));
    if(updated) await openPlace(updated);
  }catch(error){
    alert("❌ "+error.message);
  }
}

async function deleteReview(id){
  if(!currentAdmin || !currentPlace) return;
  if(!confirm("Видалити цей відгук?")) return;
  try{
    await api({action:"delete_review",telegram_id:telegramId,id,place_id:currentPlace.id});
    await openPlace(currentPlace);
  }catch(error){
    alert("❌ "+error.message);
  }
}

function setupLongPressPicker(){
  const el = map.getDiv();
  let timer = null;
  let startX = 0;
  let startY = 0;
  let active = false;
  function cancel(){ if(timer){ clearTimeout(timer); timer=null; } active=false; }
  function latLngAt(x,y){
    const projection = map.getProjection();
    if(!projection) return null;
    const rect = el.getBoundingClientRect();
    const center = projection.fromLatLngToPoint(map.getCenter());
    const scale = Math.pow(2, map.getZoom());
    const px = x - rect.left, py = y - rect.top;
    const world = new google.maps.Point(center.x + (px - rect.width/2) / scale, center.y + (py - rect.height/2) / scale);
    return projection.fromPointToLatLng(world);
  }
  function start(x,y){
    if(!pickMode) return;
    startX=x; startY=y; active=true;
    timer=setTimeout(()=>{
      if(!active || !pickMode) return;
      const ll=latLngAt(startX,startY);
      if(ll){ setCoordinates(ll.lat(),ll.lng()); if(navigator.vibrate) navigator.vibrate(30); }
      cancel();
    },700);
  }
  function move(x,y){ if(active && Math.hypot(x-startX,y-startY)>12) cancel(); }
  el.addEventListener('touchstart',e=>{ if(!pickMode) return; const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
  el.addEventListener('touchmove',e=>{ if(!active) return; const t=e.touches[0]; move(t.clientX,t.clientY); },{passive:true});
  el.addEventListener('touchend',cancel,{passive:true});
  el.addEventListener('touchcancel',cancel,{passive:true});
  el.addEventListener('mousedown',e=>{ if(e.button===0) start(e.clientX,e.clientY); });
  el.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  el.addEventListener('mouseup',cancel);
  el.addEventListener('mouseleave',cancel);
}

function setCoordinates(lat,lng){
  selectedLat=Number(lat); selectedLng=Number(lng);
  if(temporaryMarker) temporaryMarker.setMap(null);
  temporaryMarker=new google.maps.Marker({position:{lat:selectedLat,lng:selectedLng},map,draggable:true,title:"Нова точка"});
  temporaryMarker.addListener("dragend",()=>{const p=temporaryMarker.getPosition();selectedLat=p.lat();selectedLng=p.lng();updateCoordinates();reverseGeocode(selectedLat,selectedLng);});
  map.panTo({lat:selectedLat,lng:selectedLng}); map.setZoom(16); updateCoordinates();
  reverseGeocode(selectedLat,selectedLng);
  pickMode=false;
  document.getElementById("addModal").style.display="flex";
}
function reverseGeocode(lat,lng){
  if(!window.google||!google.maps)return;
  new google.maps.Geocoder().geocode({location:{lat:Number(lat),lng:Number(lng)},language:"uk",region:"UA"},(results,status)=>{
    if(status!=="OK"||!results||!results.length)return;
    selectedAddress = results[0].formatted_address || "";
  });
}

function makeStars(

){

  let result =
    "";

  const rounded =
    Math.round(
      Number(
        rating ||
        0
      )
    );

  for(
    let i=1;
    i<=5;
    i++
  ){

    result +=
      i <= rounded
        ? "★"
        : "☆";

  }

  return result;

}

  try{

    return new Date(
      date
    )
    .toLocaleDateString(
      "uk-UA",
      {
        day:
          "numeric",

        month:
          "long",

        year:
          "numeric"
      }
    );

  }catch(error){

    return "";

  }

}

function safeUrl(
  url
){

  if(!url){

    return "#";

  }

  if(
    /^https?:\/\//i.test(
      url
    )
  ){

    return url;

  }

  return (
    "https://" +
    url
  );

}

function telegramUrl(
  value
){

  const text =
    String(
      value ||
      ""
    )
    .trim();

  if(
    /^https?:\/\//i.test(
      text
    )
  ){

    return text;

  }

  return (
    "https://t.me/" +
    text.replace(
      /^@/,
      ""
    )
  );

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}

async function prepareImageFile(file){

  if(!file){
    throw new Error("Фото не вибране.");
  }

  if(!file.type.startsWith("image/")){
    throw new Error("Оберіть файл зображення.");
  }

  const maxSide=1600;
  const data=await fileToBase64(file);

  try{
    const img=await new Promise((resolve,reject)=>{
      const image=new Image();
      image.onload=()=>resolve(image);
      image.onerror=reject;
      image.src=data;
    });

    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
    canvas.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    return {data:canvas.toDataURL("image/jpeg",0.82)};
  }catch(e){
    if(/heic|heif/i.test(file.type||file.name||"")){
      throw new Error("iPhone HEIC не підтримується браузером. Відкрийте фото в Фото та виберіть JPG/JPEG.");
    }
    return {data};
  }
}

function fileToBase64(
  file
){

  return new Promise(
    function(
      resolve,
      reject
    ){

      const reader =
        new FileReader();

      reader.onload =
        function(){

          resolve(
            reader.result
          );

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}

function loadGoogleMaps(){

  if(
    window.google &&
    window.google.maps
  ){

    initMap();

    return;

  }

  const script =
    document.createElement(
      "script"
    );

  script.src =
    "https://maps.googleapis.com/maps/api/js" +
    "?key=AIzaSyD8juKXcYCwBIqfLzQFW4qVApkKxosmQFw" +
    "&callback=initMap" +
    "&libraries=geometry" +
    "&language=uk" +
    "&region=UA" +
    "" +
    "";

  script.async =
    true;

  script.defer =
    true;

  script.onload =
    function(){
      setTimeout(function(){
        if(!(window.google && window.google.maps)){
          showMapLoadError("Google Maps не відповів у Telegram.");
        }
      },7000);
    };

  script.onload =
    function(){
      setTimeout(function(){
        if(!(window.google && window.google.maps)){
          showMapLoadError("Google Maps не відповів у Telegram.");
        }
      },7000);
    };

  script.onload =
    function(){
      setTimeout(function(){
        if(!(window.google && window.google.maps)){
          showMapLoadError("Google Maps не відповів у Telegram.");
        }
      },7000);
    };

  script.onerror =
    function(){

      document
        .getElementById(
          "map"
        )
        .innerHTML =
          `

            <div
              style="
                position:absolute;
                inset:0;
                display:flex;
                align-items:center;
                justify-content:center;
                background:#0b1118;
                color:#fff;

                padding:30px;
              ">

              <div>

                <div
                  style="
                    font-size:45px;
                  ">

                  ⚠️

                </div>

                <div
                  style="
                    margin-top:10px;
                    font-size:19px;
                    font-weight:800;
                  ">

                  Не вдалося завантажити Google Maps

                </div>

                <div
                  style="
                    margin-top:7px;
                    color:#9aa7b4;
                  ">

                  Перевірте підключення Google Maps API.

                </div>

              </div>

            </div>

          `;

    };

  document
    .head
    .appendChild(
      script
    );

}

window.addEventListener(
