<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Карта натяжних стель України</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#081018;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

#app{
  position:relative;
  width:100%;
  height:100%;
}

/* =========================
   GOOGLE MAP
========================= */

#map{
  position:absolute;
  inset:0;
  z-index:1;
  background:#15202b;
}

.marker-rating{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;

  min-width:58px;
  height:34px;

  padding:0 10px;

  background:#fff;
  color:#111;

  border:2px solid rgba(0,0,0,.15);
  border-radius:20px;

  box-shadow:0 4px 14px rgba(0,0,0,.4);

  font-size:13px;
  font-weight:800;

  white-space:nowrap;
}

.marker-rating .star{
  color:#f5b900;
  font-size:15px;
}

/* =========================
   TOP
========================= */

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;

  z-index:1000;

  padding:9px;

  background:rgba(8,14,20,.94);

  backdrop-filter:blur(18px);

  box-shadow:0 2px 18px rgba(0,0,0,.4);
}

.header{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.title{
  flex:1;
  font-size:17px;
  font-weight:800;
}

.top-btn{
  height:39px;
  padding:0 12px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:11px;

  background:#141f2a;
  color:#fff;

  font-size:13px;
  font-weight:800;
}

.top-btn.blue{
  background:#087cf5;
  border-color:#087cf5;
}

.search-row{
  display:flex;
  gap:7px;
}

.search{
  flex:1;

  height:43px;

  padding:0 13px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:12px;

  outline:none;

  background:#121c26;
  color:#fff;

  font-size:14px;
}

.search::placeholder{
  color:#778594;
}

.filter-btn{
  width:45px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:12px;

  background:#121c26;
  color:#fff;

  font-size:19px;
}

/* =========================
   CATEGORIES
========================= */

.categories{
  display:flex;
  gap:7px;
  padding-top:8px;

  overflow-x:auto;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:0 0 auto;

  height:36px;
  padding:0 13px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;

  background:#131e28;
  color:#fff;

  font-size:12px;
  font-weight:800;
}

.category.active{
  background:#087cf5;
  border-color:#087cf5;
}

/* =========================
   MAP BUTTONS
========================= */

.map-buttons{
  position:absolute;

  right:12px;
  bottom:115px;

  z-index:900;

  display:flex;
  flex-direction:column;
  gap:8px;
}

.map-button{
  width:47px;
  height:47px;

  border:1px solid rgba(255,255,255,.14);
  border-radius:13px;

  background:#121c26;
  color:#fff;

  font-size:23px;

  box-shadow:0 4px 16px rgba(0,0,0,.35);
}

/* НОВАЯ КНОПКА КАРТА / СПУТНИК */

.map-type-button{
  width:47px;
  height:47px;

  border:1px solid rgba(255,255,255,.14);
  border-radius:13px;

  background:#121c26;
  color:#fff;

  font-size:20px;

  box-shadow:0 4px 16px rgba(0,0,0,.35);
}

.my-location{
  position:absolute;

  left:14px;
  bottom:115px;

  z-index:900;

  width:49px;
  height:49px;

  border:0;
  border-radius:50%;

  background:#087cf5;
  color:#fff;

  font-size:24px;

  box-shadow:0 4px 18px rgba(0,0,0,.4);
}

/* =========================
   CARD
========================= */

.card{
  position:absolute;

  left:8px;
  right:8px;
  bottom:8px;

  z-index:1200;

  display:none;

  max-height:82%;
  overflow-y:auto;

  background:#0d151e;

  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;

  box-shadow:0 -10px 40px rgba(0,0,0,.55);
}

.card-handle{
  width:40px;
  height:5px;

  margin:9px auto;

  border-radius:5px;

  background:#667582;
}

.card-close{
  position:absolute;

  top:10px;
  right:12px;

  z-index:10;

  width:38px;
  height:38px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:50%;

  background:rgba(0,0,0,.45);
  color:#fff;

  font-size:23px;
}

.card-main{
  padding:5px 17px 0;
}

.card-image{
  display:none;

  width:100%;
  height:210px;

  object-fit:cover;

  margin-bottom:12px;

  border-radius:15px;

  background:#17222c;
}

.card-name{
  padding-right:45px;

  font-size:23px;
  font-weight:800;
  line-height:1.18;
}

.rating-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;

  gap:7px;

  margin-top:8px;
  margin-bottom:13px;
}

.rating-number{
  font-size:20px;
  font-weight:800;
}

.stars{
  color:#ffc400;
  letter-spacing:1px;
}

.review-count{
  color:#aab5c0;
  font-size:13px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.action{
  height:41px;
  padding:0 14px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:21px;

  background:#141f29;
  color:#fff;

  font-size:13px;
  font-weight:800;
}

.action.primary{
  background:#087cf5;
  border-color:#087cf5;
}

.action.danger{
  background:#d7353d;
  border-color:#d7353d;
}

.info{
  margin:15px 17px 0;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.11);
  border-radius:14px;
}

.info-row{
  display:flex;
  gap:10px;

  padding:12px;

  border-bottom:1px solid rgba(255,255,255,.07);

  font-size:14px;
}

.info-row:last-child{
  border-bottom:0;
}

.info-icon{
  width:22px;
}

.info-value{
  flex:1;
  word-break:break-word;
  color:#d5dce3;
}

.info-value a{
  color:#48afff;
  text-decoration:none;
}

.description{
  padding:15px 17px;

  color:#c8d1da;

  font-size:14px;
  line-height:1.5;
}

/* =========================
   REVIEWS
========================= */

.review-title{
  padding:3px 17px 9px;

  font-size:19px;
  font-weight:800;
}

.reviews{
  display:flex;
  gap:9px;

  padding:0 17px 15px;

  overflow-x:auto;
  scrollbar-width:none;
}

.reviews::-webkit-scrollbar{
  display:none;
}

.review{
  flex:0 0 270px;

  padding:13px;

  background:#121c26;

  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
}

.review-author{
  font-weight:800;
}

.review-date{
  margin-top:3px;

  color:#788592;
  font-size:11px;
}

.review-stars{
  margin:8px 0;
  color:#ffc400;
}

.review-text{
  color:#cbd3dc;

  font-size:13px;
  line-height:1.45;
}

.review-form{
  margin:0 17px 17px;
  padding:14px;

  background:#121c26;

  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
}

.review-form-title{
  margin-bottom:8px;

  font-size:17px;
  font-weight:800;
}

.star-select{
  display:flex;
  gap:3px;
  margin-bottom:9px;
}

.star-select button{
  padding:0;

  border:0;
  background:none;

  color:#66727f;

  font-size:30px;
}

.star-select button.active{
  color:#ffc400;
}

/* =========================
   MODALS
========================= */

.modal{
  position:absolute;
  inset:0;

  z-index:2000;

  display:none;
  align-items:flex-end;

  background:rgba(0,0,0,.72);
}

.modal-box{
  width:100%;
  max-height:94%;

  overflow-y:auto;

  padding:18px;

  background:#0d151e;

  border-radius:22px 22px 0 0;
}

.modal-title{
  margin-bottom:15px;

  font-size:21px;
  font-weight:800;
}

.group{
  margin-bottom:11px;
}

.label{
  display:block;

  margin-bottom:5px;

  color:#aeb8c2;

  font-size:13px;
  font-weight:700;
}

.input,
.select,
.textarea{
  width:100%;

  padding:12px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:10px;

  outline:none;

  background:#101923;
  color:#fff;

  font-size:15px;
}

.textarea{
  min-height:90px;
  resize:vertical;
}

.modal-button{
  width:100%;
  height:45px;

  margin-top:7px;

  border:0;
  border-radius:11px;

  background:#087cf5;
  color:#fff;

  font-size:15px;
  font-weight:800;
}

.modal-button.gray{
  background:#293540;
}

.modal-button.red{
  background:#d7353d;
}

.address-results{
  margin-top:7px;
}

.address-result{
  width:100%;

  padding:10px;
  margin-bottom:5px;

  text-align:left;

  border:1px solid rgba(255,255,255,.1);
  border-radius:9px;

  background:#151f29;
  color:#fff;

  font-size:13px;
}

.coords{
  padding:7px 0;

  color:#8c99a6;
  font-size:12px;
}

/* =========================
   ADMIN
========================= */

.pending{
  padding:12px;
  margin-bottom:9px;

  border:1px solid rgba(255,255,255,.11);
  border-radius:12px;

  background:#121c26;
}

.pending-name{
  margin-bottom:5px;

  font-size:17px;
  font-weight:800;
}

.pending-info{
  color:#aeb8c2;

  font-size:13px;
  line-height:1.5;
}

.pending-actions{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.pending-actions button{
  flex:1;
}

.admin-item{
  padding:12px;
  margin-bottom:8px;

  border:1px solid rgba(255,255,255,.1);
  border-radius:11px;

  background:#121c26;
}

.admin-name{
  font-weight:800;
}

.admin-meta{
  margin-top:4px;

  color:#9da9b5;
  font-size:12px;
}

.empty{
  position:absolute;

  top:160px;
  left:15px;
  right:15px;

  z-index:500;

  display:none;

  padding:13px;

  border-radius:12px;

  background:#121c26;

  text-align:center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .top{
    padding:8px;
  }

  .title{
    font-size:16px;
  }

  .top-btn{
    height:36px;
    padding:0 9px;
    font-size:12px;
  }

  .card{
    left:0;
    right:0;
    bottom:0;

    max-height:89%;

    border-radius:21px 21px 0 0;
  }

  .card-main{
    padding:5px 12px 0;
  }

  .card-image{
    height:205px;
  }

  .card-name{
    margin-top:9px;
    font-size:21px;
  }

  .info{
    margin-left:12px;
    margin-right:12px;
  }

  .description{
    padding-left:12px;
    padding-right:12px;
  }

  .review-title{
    padding-left:12px;
  }

  .reviews{
    padding-left:12px;
  }

  .review-form{
    margin-left:12px;
    margin-right:12px;
  }

  .map-buttons{
    bottom:125px;
  }

  .my-location{
    bottom:125px;
  }

}

</style>
</head>

<body>

<div id="app">

  <div class="top">

    <div class="header">

      <div class="title">
        🗺 Карта натяжних стель
      </div>

      <button
        id="addButton"
        class="top-btn blue"
        onclick="openAdd()">
        ＋ Додати
      </button>

      <button
        id="adminButton"
        class="top-btn"
        onclick="openAdmin()"
        style="display:none">
        👑 Адмін
      </button>

    </div>

    <div class="search-row">

      <input
        id="search"
        class="search"
        placeholder="🔍 Пошук компанії, міста, адреси"
      >

      <button
        class="filter-btn"
        onclick="toggleCategories()">
        ☷
      </button>

    </div>

    <div
      id="categories"
      class="categories">

      <button
        class="category active"
        data-cat="all">
        ▦ Всі
      </button>

      <button
        class="category"
        data-cat="manufacturer">
        🏭 Виробники
      </button>

      <button
        class="category"
        data-cat="shop">
        🏪 Магазини
      </button>

      <button
        class="category"
        data-cat="tools">
        🔧 Інструмент
      </button>

      <button
        class="category"
        data-cat="gas">
        🔥 Газ
      </button>

      <button
        class="category"
        data-cat="services">
        🛠 Послуги
      </button>

    </div>

  </div>


  <div id="map"></div>


  <div class="map-buttons">

    <button
      class="map-button"
      onclick="zoomIn()">
      ＋
    </button>

    <button
      class="map-button"
      onclick="zoomOut()">
      −
    </button>

    <button
      id="mapTypeButton"
      class="map-type-button"
      onclick="toggleMapType()"
      title="Карта / Спутник">
      🛰
    </button>

  </div>


  <button
    class="my-location"
    onclick="findMe()">
    ◎
  </button>


  <div
    id="empty"
    class="empty">
    Нічого не знайдено
  </div>


  <div
    id="card"
    class="card">

    <div class="card-handle"></div>

    <button
      class="card-close"
      onclick="closeCard()">
      ×
    </button>

    <div class="card-main">

      <img
        id="cardImage"
        class="card-image"
      >

      <div
        id="cardName"
        class="card-name">
      </div>

      <div class="rating-row">

        <span
          id="cardRating"
          class="rating-number">
        </span>

        <span
          id="cardStars"
          class="stars">
        </span>

        <span
          id="cardReviews"
          class="review-count">
        </span>

      </div>

      <div class="actions">

        <button
          id="routeButton"
          class="action primary">
          ➤ Маршрут
        </button>

        <button
          id="phoneButton"
          class="action">
          ☎ Дзвінок
        </button>

        <button
          id="siteButton"
          class="action">
          🌐 Сайт
        </button>

        <button
          id="telegramButton"
          class="action">
          ✈️ Telegram
        </button>

      </div>

    </div>


    <div
      id="placeInfo"
      class="info">
    </div>


    <div
      id="placeDescription"
      class="description"
      style="display:none">
    </div>


    <div class="review-title">
      Відгуки
    </div>


    <div
      id="reviews"
      class="reviews">
    </div>


    <div class="review-form">

      <div class="review-form-title">
        ⭐ Ваша оцінка
      </div>

      <div
        id="starSelect"
        class="star-select">

        <button data-star="1">☆</button>
        <button data-star="2">☆</button>
        <button data-star="3">☆</button>
        <button data-star="4">☆</button>
        <button data-star="5">☆</button>

      </div>

      <input
        id="reviewName"
        class="input"
        placeholder="Ваше ім'я"
      >

      <textarea
        id="reviewText"
        class="textarea"
        placeholder="Ваш відгук..."
      ></textarea>

      <button
        class="modal-button"
        onclick="sendReview()">
        Надіслати відгук
      </button>

    </div>


    <div
      id="adminPlaceActions"
      style="display:none;padding:0 17px 17px">

      <div class="actions">

        <button
          class="action"
          onclick="editPlace()">
          ✏️ Редагувати
        </button>

        <button
          class="action danger"
          onclick="deletePlace()">
          🗑 Видалити
        </button>

      </div>

    </div>

  </div>
    <!-- =========================
       ADD PLACE MODAL
  ========================== -->

  <div
    id="addModal"
    class="modal">

    <div class="modal-box">

      <div
        id="addTitle"
        class="modal-title">
        ➕ Додати точку
      </div>


      <div class="group">

        <label class="label">
          Тип точки
        </label>

        <select
          id="newCategory"
          class="select">

          <option value="manufacturer">
            🏭 Виробник
          </option>

          <option value="shop">
            🏪 Магазин / постачальник
          </option>

          <option value="tools">
            🔧 Інструмент
          </option>

          <option value="gas">
            🔥 Газ
          </option>

          <option value="services">
            🛠 Послуги
          </option>

        </select>

      </div>


      <div class="group">

        <label class="label">
          Назва
        </label>

        <input
          id="newName"
          class="input"
          placeholder="Назва компанії">

      </div>


      <div class="group">

        <label class="label">
          Адреса
        </label>

        <input
          id="newAddress"
          class="input"
          placeholder="Київ, вул. ...">

        <button
          class="modal-button"
          onclick="searchAddress()">
          🔎 Знайти адресу
        </button>

        <div
          id="addressResults"
          class="address-results">
        </div>

      </div>


      <div class="group">

        <label class="label">
          Телефон
        </label>

        <input
          id="newPhone"
          class="input"
          type="tel"
          placeholder="+380...">

      </div>


      <div class="group">

        <label class="label">
          Telegram
        </label>

        <input
          id="newTelegram"
          class="input"
          placeholder="@username або посилання">

      </div>


      <div class="group">

        <label class="label">
          Сайт
        </label>

        <input
          id="newWebsite"
          class="input"
          placeholder="https://...">

      </div>


      <div class="group">

        <label class="label">
          Опис
        </label>

        <textarea
          id="newDescription"
          class="textarea"
          placeholder="Короткий опис компанії..."></textarea>

      </div>


      <div class="group">

        <label class="label">
          Фото / логотип
        </label>

        <input
          id="newLogo"
          class="input"
          type="file"
          accept="image/*">

      </div>


      <div
        id="coords"
        class="coords">
        📍 Координати не вибрані
      </div>


      <button
        class="modal-button"
        onclick="startMapPick()">
        📍 Поставити точку на карті
      </button>


      <button
        class="modal-button"
        onclick="savePlace()">
        ✅ Зберегти
      </button>


      <button
        class="modal-button gray"
        onclick="closeAdd()">
        Закрити
      </button>

    </div>

  </div>


  <!-- =========================
       ADMIN MODAL
  ========================== -->

  <div
    id="adminModal"
    class="modal">

    <div class="modal-box">

      <div class="modal-title">
        👑 Адмін-панель
      </div>


      <button
        class="modal-button"
        onclick="showPending()">
        ⏳ Заявки на модерацію
      </button>


      <div
        id="ownerSection"
        style="display:none">

        <button
          class="modal-button"
          onclick="showAdmins()">
          👥 Адміністратори
        </button>

        <div
          id="adminsBox"
          style="margin-top:12px">
        </div>

      </div>


      <div
        id="pendingBox"
        style="margin-top:12px">
      </div>


      <button
        class="modal-button gray"
        onclick="closeAdmin()">
        Закрити
      </button>

    </div>

  </div>


  <!-- =========================
       ADD ADMIN MODAL
  ========================== -->

  <div
    id="addAdminModal"
    class="modal">

    <div class="modal-box">

      <div class="modal-title">
        👥 Додати адміністратора
      </div>


      <div class="group">

        <label class="label">
          Telegram ID
        </label>

        <input
          id="adminTelegramId"
          class="input"
          placeholder="Наприклад: 123456789">

      </div>


      <div class="group">

        <label class="label">
          Ім'я
        </label>

        <input
          id="adminName"
          class="input"
          placeholder="Ім'я адміністратора">

      </div>


      <div class="group">

        <label class="label">
          Роль
        </label>

async function loadPlaces(){

  try{

      await fetch(
        MAP_API,
        {
          headers:{
            "apikey":
              SUPABASE_KEY
          }
        }
      );


    const data =
      await response.json();


    if(
      Array.isArray(data)
    ){

      places = data;

    }else if(
      data &&
      Array.isArray(
        data.places
      )
    ){

      places =
        data.places;

    }else{

      places = [];

    }


    renderMarkers();

  }catch(error){

    console.error(
      "Load places:",
      error
    );


    places = [];

    renderMarkers();

  }

/* =====================================================
   MARKERS
===================================================== */

function renderMarkers(){

  if(!map){

    return;

  }


  places.forEach(
    place=>{

      if(
        place.__marker
      ){

        place.__marker.setMap(
          null
        );

      }

    }
  );


  const query =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  let visible = 0;


  places.forEach(
    place=>{

      const lat =
        Number(
          place.latitude ??
          place.lat
        );


      const lng =
        Number(
          place.longitude ??
          place.lng
        );


      if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ){

        return;

      }


      const category =
        String(
          place.category ||
          ""
        );


      const categoryOK =
        activeCategory ===
          "all" ||
        category ===
          activeCategory;


      const searchable =
        (
          String(
            place.name ||
            ""
          ) +
          " " +
          String(
            place.address ||
            ""
          ) +
          " " +
          String(
            place.city ||
            ""
          )
        )
        .toLowerCase();


      const searchOK =
        !query ||
        searchable.includes(
          query
        );


      if(
        !categoryOK ||
        !searchOK
      ){

        return;

      }


      visible++;


      const rating =
        Number(
          place.rating ||
          0
        );


      const labelText =
        rating > 0
          ? `★ ${rating.toFixed(1)}`
          : "★ —";


      const marker =
        new google.maps.Marker(
          {
            position:{
              lat,
              lng
            },

            map,

            title:
              place.name ||
              "",

            label:{
              text:
                labelText,

              color:"#111",

              fontWeight:"800",

              fontSize:"13px"
            }
          }
        );


      marker.addListener(
        "click",
        function(){

          openPlace(
            place
          );

        }
      );


      place.__marker =
        marker;

    }
  );


  document
    .getElementById(
      "empty"
    )
    .style.display =
      visible
        ? "none"
        : "block";

}

function setupReviews(){

  document
    .querySelectorAll(
      "#starSelect button"
    )
    .forEach(
      button=>{

        button.onclick =
          function(){

            selectedRating =
              Number(
                button.dataset.star
              );


            document
              .querySelectorAll(
                "#starSelect button"
              )
              .forEach(
                item=>{

                  const number =
                    Number(
                      item.dataset.star
                    );


                  item.textContent =
                    number <=
                    selectedRating
                      ? "★"
                      : "☆";


                  item.classList.toggle(
                    "active",
                    number <=
                    selectedRating
                  );

                }
              );

          };

      }
    );

}

===================================================== */

async function loadReviews(
  placeId
){

  const box =
    document
      .getElementById(
        "reviews"
      );


  box.innerHTML =
    `
      <div class="review">
        Завантаження відгуків...
      </div>
    `;


  try{

    const data =
      await api(
        {
          action:"reviews",

          place_id:
            placeId
        }
      );


    const list =
      Array.isArray(data)
        ? data
        : (
            Array.isArray(
              data.reviews
            )
            ?
            data.reviews
            :
            []
          );


    if(
      !list.length
    ){

      box.innerHTML =
        `
          <div class="review">

            <div class="review-author">
              Поки немає відгуків
            </div>

            <div class="review-text">
              Будьте першим!
            </div>

          </div>
        `;

      return;

    }


    box.innerHTML =
      list
        .map(
          review=>`

            <div class="review">

              <div class="review-author">
                ${escapeHtml(
                  review.author_name ||
                  review.name ||
                  "Анонім"
                )}
              </div>

              <div class="review-date">
                ${formatDate(
                  review.created_at
                )}
              </div>

              <div class="review-stars">
                ${makeStars(
                  Number(
                    review.rating ||
                    0
                  )
                )}
              </div>

              <div class="review-text">
                ${escapeHtml(
                  review.review_text ||
                  review.text ||
                  ""
                )}
              </div>

            </div>

          `
        )
        .join("");


  }catch(error){

    box.innerHTML =
      `
        <div class="review">
          Не вдалося завантажити відгуки.
        </div>
      `;

  }

}


/* =====================================================
   SEND REVIEW
===================================================== */

async function sendReview(){

  if(!currentPlace){

    return;

  }


  if(!selectedRating){

    alert(
      "Оберіть оцінку."
    );

    return;

  }


  const text =
    document
      .getElementById(
        "reviewText"
      )
      .value
      .trim();


  if(!text){

    alert(
      "Напишіть відгук."
    );

    return;

  }


  const name =
    document
      .getElementById(
        "reviewName"
      )
      .value
      .trim()
      ||
      "Анонім";


  try{

    await api(
      {
        action:
          "add_review",

        place_id:
          currentPlace.id,

        author_name:
          name,

        rating:
          selectedRating,

        review_text:
          text
      }
    );


    document
      .getElementById(
        "reviewName"
      )
      .value = "";


    document
      .getElementById(
        "reviewText"
      )
      .value = "";


    selectedRating =
      0;


    document
      .querySelectorAll(
        "#starSelect button"
      )
      .forEach(
        button=>{

          button.textContent =
            "☆";

          button.classList.remove(
            "active"
          );

        }
      );


    alert(
      "Дякуємо за відгук!"
    );


    await loadPlaces();


    const updated =
      places.find(
        item =>
          String(
            item.id
          ) ===
          String(
            currentPlace.id
          )
      );


    if(updated){

      await openPlace(
        updated
      );

    }


  }catch(error){

    alert(
      "❌ " +
      error.message
    );

  }

}

        Закрити
      </button>

    </div>

  </div>


</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const SUPABASE_URL =
  "https://usggjqukcqzttrilgmmo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_g3Hi1tMxV4sV5bYXBpijBA_nHFd0zxA";

const MAP_API =
  SUPABASE_URL +
  "/functions/v1/map-api";

const OWNER_ID =
  "8186262020";


/* =====================================================
   TELEGRAM
===================================================== */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


if(tg){

  tg.ready();

  try{
    tg.expand();
  }catch(e){}

}


/* =====================================================
   STATE
===================================================== */

let telegramId = "";

let currentAdmin = null;

let places = [];

let currentPlace = null;

let currentMarker = null;

let selectedLat = null;

let selectedLng = null;

let pickMode = false;

let editingId = null;

let selectedRating = 0;

let activeCategory = "all";

let map = null;

let temporaryMarker = null;

let mapType = "roadmap";


/* =====================================================
   API
===================================================== */

async function api(body){

  const response =
    await fetch(
      MAP_API,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY
        },

        body:JSON.stringify(body)
      }
    );


  let data = {};

  try{

    data =
      await response.json();

  }catch(error){

    data = {};

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "Помилка сервера"
    );

  }


  return data;

}


/* =====================================================
   GOOGLE MAP INIT
===================================================== */

function initMap(){

  map =
    new google.maps.Map(
      document.getElementById("map"),
      {

        center:{
          lat:48.5,
          lng:31.2
        },

        zoom:6,

        mapTypeId:
          google.maps.MapTypeId.ROADMAP,

        mapTypeControl:true,

        mapTypeControlOptions:{
          position:
            google.maps.ControlPosition.TOP_RIGHT,

          style:
            google.maps.MapTypeControlStyle.HORIZONTAL_BAR,

          mapTypeIds:[
            google.maps.MapTypeId.ROADMAP,
            google.maps.MapTypeId.SATELLITE,
            google.maps.MapTypeId.HYBRID,
            google.maps.MapTypeId.TERRAIN
          ]
        },

        streetViewControl:false,

        fullscreenControl:true,

        zoomControl:false,

        gestureHandling:"greedy",

        styles:darkMapStyle()

      }
    );


  map.addListener(
    "click",
    function(event){

      if(!pickMode){

        return;

      }


      setCoordinates(
        event.latLng.lat(),
        event.latLng.lng()
      );

    }
  );


  setupInterface();

  setupReviews();

  detectTelegramUser();

}


/* =====================================================
   DARK GOOGLE MAP STYLE
===================================================== */

function darkMapStyle(){

  return [

    {
      elementType:"geometry",
      stylers:[
        {
          color:"#18212b"
        }
      ]
    },

    {
      elementType:"labels.text.fill",
      stylers:[
        {
          color:"#b8c2cc"
        }
      ]
    },

    {
      elementType:"labels.text.stroke",
      stylers:[
        {
          color:"#18212b"
        }
      ]
    },

    {
      featureType:"administrative",
      elementType:"geometry",
      stylers:[
        {
          color:"#34414d"
        }
      ]
    },

    {
      featureType:"road",
      elementType:"geometry",
      stylers:[
        {
          color:"#354250"
        }
      ]
    },

    {
      featureType:"road.highway",
      elementType:"geometry",
      stylers:[
        {
          color:"#455463"
        }
      ]
    },

    {
      featureType:"road",
      elementType:"labels.text.fill",
      stylers:[
        {
          color:"#c6d0da"
        }
      ]
    },

    {
      featureType:"water",
      elementType:"geometry",
      stylers:[
        {
          color:"#071e3c"
        }
      ]
    },

    {
      featureType:"poi",
      stylers:[
        {
          visibility:"simplified"
        }
      ]
    }

  ];

}


/* =====================================================
   GOOGLE MAP TYPE
===================================================== */

function toggleMapType(){

  if(!map){

    return;

  }


  if(
    map.getMapTypeId() ===
    google.maps.MapTypeId.SATELLITE
  ){

    map.setMapTypeId(
      google.maps.MapTypeId.ROADMAP
    );

    document
      .getElementById(
        "mapTypeButton"
      )
      .textContent =
        "🛰";

  }else{

    map.setMapTypeId(
      google.maps.MapTypeId.SATELLITE
    );

    document
      .getElementById(
        "mapTypeButton"
      )
      .textContent =
        "🗺";

  }

}


/* =====================================================
   TELEGRAM USER
===================================================== */

async function detectTelegramUser(){

  if(tg){

    telegramId =
      String(
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user &&
        tg.initDataUnsafe.user.id
        || ""
      );

  }


  /*
     Для власника використовуємо
     Telegram ID 8186262020.
  */

  if(
    telegramId ===
    OWNER_ID
  ){

    currentAdmin = {
      telegram_id:OWNER_ID,
      role:"owner",
      active:true
    };


    document
      .getElementById(
        "adminButton"
      )
      .style.display =
        "block";


    document
      .getElementById(
        "ownerSection"
      )
      .style.display =
        "block";

  }


  await detectAdmin();

  await loadPlaces();

}


/* =====================================================
   ADMIN DETECTION
===================================================== */

async function detectAdmin(){

  if(!telegramId){

    return;

  }


  try{

    const data =
      await api(
        {
          action:"admins",

          telegram_id:
            telegramId
        }
      );


    const list =
      Array.isArray(data)
        ? data
        : (
            Array.isArray(data.admins)
              ? data.admins
              : []
          );


    const found =
      list.find(
        admin =>
          String(
            admin.telegram_id
          ) ===
          String(
            telegramId
          ) &&
          admin.active !== false
      );


    if(found){

      currentAdmin =
        found;


      document
        .getElementById(
          "adminButton"
        )
        .style.display =
          "block";


      if(
        found.role ===
        "owner"
      ){

        document
          .getElementById(
            "ownerSection"
          )
          .style.display =
            "block";

      }

    }

  }catch(error){

    console.log(
      "Admin check:",
      error.message
    );

  }

}


/* =====================================================
   INTERFACE
===================================================== */

function setupInterface(){

  document
    .getElementById(
      "search"
    )
    .addEventListener(
      "input",
      renderMarkers
    );


  document
    .querySelectorAll(
      ".category"
    )
    .forEach(
      button=>{

        button.onclick =
          function(){

            document
              .querySelectorAll(
                ".category"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


            button.classList.add(
              "active"
            );


            activeCategory =
              button.dataset.cat;


            renderMarkers();

          };

      }
    );

}


/* =====================================================
   LOAD PLACES
===================================================== */

async function loadPlaces(){

  try{

    const response =
      await fetch(
        MAP_API,
        {
          headers:{
            "apikey":
              SUPABASE_KEY
          }
        }
      );


    const data =
      await response.json();


    if(
      Array.isArray(data)
    ){

      places = data;

    }else if(
      data &&
      Array.isArray(
        data.places
      )
    ){

      places =
        data.places;

    }else{

      places = [];

    }


    renderMarkers();

  }catch(error){

    console.error(
      "Load places:",
      error
    );


    places = [];

    renderMarkers();

  }

}


/* =====================================================
   MARKERS
===================================================== */

function renderMarkers(){

  if(!map){

    return;

  }


  places.forEach(
    place=>{

      if(
        place.__marker
      ){

        place.__marker.setMap(
          null
        );

      }

    }
  );


  const query =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  let visible = 0;


  places.forEach(
    place=>{

      const lat =
        Number(
          place.latitude ??
          place.lat
        );


      const lng =
        Number(
          place.longitude ??
          place.lng
        );


      if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ){

        return;

      }


      const category =
        String(
          place.category ||
          ""
        );


      const categoryOK =
        activeCategory ===
          "all" ||
        category ===
          activeCategory;


      const searchable =
        (
          String(
            place.name ||
            ""
          ) +
          " " +
          String(
            place.address ||
            ""
          ) +
          " " +
          String(
            place.city ||
            ""
          )
        )
        .toLowerCase();


      const searchOK =
        !query ||
        searchable.includes(
          query
        );


      if(
        !categoryOK ||
        !searchOK
      ){

        return;

      }


      visible++;


      const rating =
        Number(
          place.rating ||
          0
        );


      const labelText =
        rating > 0
          ? `★ ${rating.toFixed(1)}`
          : "★ —";


      const marker =
        new google.maps.Marker(
          {
            position:{
              lat,
              lng
            },

            map,

            title:
              place.name ||
              "",

            label:{
              text:
                labelText,

              color:"#111",

              fontWeight:"800",

              fontSize:"13px"
            }
          }
        );


      marker.addListener(
        "click",
        function(){

          openPlace(
            place
          );

        }
      );


      place.__marker =
        marker;

    }
  );


  document
    .getElementById(
      "empty"
    )
    .style.display =
      visible
        ? "none"
        : "block";

}


/* =====================================================
   PLACE CARD
===================================================== */

async function openPlace(
  place
){

  currentPlace =
    place;


  document
    .getElementById(
      "card"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "cardName"
    )
    .textContent =
      place.name ||
      "Без назви";


  const rating =
    Number(
      place.rating ||
      0
    );


  document
    .getElementById(
      "cardRating"
    )
    .textContent =
      rating
        ? rating.toFixed(1)
        : "—";


  document
    .getElementById(
      "cardStars"
    )
    .textContent =
      makeStars(
        rating
      );


  document
    .getElementById(
      "cardReviews"
    )
    .textContent =
      `(${place.reviews_count || 0})`;


  const image =
    document
      .getElementById(
        "cardImage"
      );


  if(
    place.logo_url
  ){

    image.src =
      place.logo_url;

    image.style.display =
      "block";

  }else{

    image.removeAttribute(
      "src"
    );

    image.style.display =
      "none";

  }


  document
    .getElementById(
      "placeInfo"
    )
    .innerHTML =

      infoRow(
        "📍",
        escapeHtml(
          place.address ||
          "Адреса не вказана"
        )
      ) +

      infoRow(
        "☎",
        place.phone
          ?
          `
            <a
              href="tel:${escapeAttribute(
                place.phone
              )}">
              ${escapeHtml(
                place.phone
              )}
            </a>
          `
          :
          "Телефон не вказаний"
      ) +

      infoRow(
        "✈️",
        place.telegram
          ?
          `
            <a
              href="${telegramUrl(
                place.telegram
              )}"
              target="_blank">
              ${escapeHtml(
                place.telegram
              )}
            </a>
          `
          :
          "Telegram не вказаний"
      ) +

      infoRow(
        "🌐",
        place.website
          ?
          `
            <a
              href="${safeUrl(
                place.website
              )}"
              target="_blank">
              ${escapeHtml(
                place.website
              )}
            </a>
          `
          :
          "Сайт не вказаний"
      );


  const description =
    document
      .getElementById(
        "placeDescription"
      );


  if(
    place.description
  ){

    description.textContent =
      place.description;

    description.style.display =
      "block";

  }else{

    description.style.display =
      "none";

  }


  setupCardButtons(
    place
  );


  document
    .getElementById(
      "adminPlaceActions"
    )
    .style.display =
      currentAdmin
        ? "block"
        : "none";


  await loadReviews(
    place.id
  );

}


/* =====================================================
   INFO
===================================================== */

function infoRow(
  icon,
  value
){

  return `
    <div class="info-row">

      <div class="info-icon">
        ${icon}
      </div>

      <div class="info-value">
        ${value}
      </div>

    </div>
  `;

}


/* =====================================================
   CARD BUTTONS
===================================================== */

function setupCardButtons(
  place
){

  const lat =
    Number(
      place.latitude ??
      place.lat
    );


  const lng =
    Number(
      place.longitude ??
      place.lng
    );


  document
    .getElementById(
      "routeButton"
    )
    .onclick =
      function(){

        const url =
          "https://www.google.com/maps/dir/?api=1" +
          "&destination=" +
          encodeURIComponent(
            `${lat},${lng}`
          );


        openExternal(
          url
        );

      };


  const phoneButton =
    document
      .getElementById(
        "phoneButton"
      );


  if(
    place.phone
  ){

    phoneButton.style.display =
      "block";


    phoneButton.onclick =
      function(){

        window.location.href =
          "tel:" +
          place.phone;

      };

  }else{

    phoneButton.style.display =
      "none";

  }


  const siteButton =
    document
      .getElementById(
        "siteButton"
      );


  if(
    place.website
  ){

    siteButton.style.display =
      "block";


    siteButton.onclick =
      function(){

        openExternal(
          safeUrl(
            place.website
          )
        );

      };

  }else{

    siteButton.style.display =
      "none";

  }


  const telegramButton =
    document
      .getElementById(
        "telegramButton"
      );


  if(
    place.telegram
  ){

    telegramButton.style.display =
      "block";


    telegramButton.onclick =
      function(){

        openExternal(
          telegramUrl(
            place.telegram
          )
        );

      };

  }else{

    telegramButton.style.display =
      "none";

  }

}


/* =====================================================
   CLOSE CARD
===================================================== */

function closeCard(){

  document
    .getElementById(
      "card"
    )
    .style.display =
      "none";


  currentPlace =
    null;

}


/* =====================================================
   REVIEWS
===================================================== */

function setupReviews(){

  document
    .querySelectorAll(
      "#starSelect button"
    )
    .forEach(
      button=>{

        button.onclick =
          function(){

            selectedRating =
              Number(
                button.dataset.star
              );


            document
              .querySelectorAll(
                "#starSelect button"
              )
              .forEach(
                item=>{

                  const number =
                    Number(
                      item.dataset.star
                    );


                  item.textContent =
                    number <=
                    selectedRating
                      ? "★"
                      : "☆";


                  item.classList.toggle(
                    "active",
                    number <=
                    selectedRating
                  );

                }
              );

          };

      }
    );

}


/* =====================================================
   REVIEWS LOAD
===================================================== */

async function loadReviews(
  placeId
){

  const box =
    document
      .getElementById(
        "reviews"
      );


  box.innerHTML =
    `
      <div class="review">
        Завантаження відгуків...
      </div>
    `;


  try{

    const data =
      await api(
        {
          action:"reviews",

          place_id:
            placeId
        }
      );


    const list =
      Array.isArray(data)
        ? data
        : (
            Array.isArray(
              data.reviews
            )
            ?
            data.reviews
            :
            []
          );


    if(
      !list.length
    ){

      box.innerHTML =
        `
          <div class="review">

            <div class="review-author">
              Поки немає відгуків
            </div>

            <div class="review-text">
              Будьте першим!
            </div>

          </div>
        `;

      return;

    }


    box.innerHTML =
      list
        .map(
          review=>`

            <div class="review">

              <div class="review-author">
                ${escapeHtml(
                  review.author_name ||
                  review.name ||
                  "Анонім"
                )}
              </div>

              <div class="review-date">
                ${formatDate(
                  review.created_at
                )}
              </div>

              <div class="review-stars">
                ${makeStars(
                  Number(
                    review.rating ||
                    0
                  )
                )}
              </div>

              <div class="review-text">
                ${escapeHtml(
                  review.review_text ||
                  review.text ||
                  ""
                )}
              </div>

            </div>

          `
        )
        .join("");


  }catch(error){

    box.innerHTML =
      `
        <div class="review">
          Не вдалося завантажити відгуки.
        </div>
      `;

  }

}


/* =====================================================
   SEND REVIEW
===================================================== */

async function sendReview(){

  if(!currentPlace){

    return;

  }


  if(!selectedRating){

    alert(
      "Оберіть оцінку."
    );

    return;

  }


  const text =
    document
      .getElementById(
        "reviewText"
      )
      .value
      .trim();


  if(!text){

    alert(
      "Напишіть відгук."
    );

    return;

  }


  const name =
    document
      .getElementById(
        "reviewName"
      )
      .value
      .trim()
      ||
      "Анонім";


  try{

    await api(
      {
        action:
          "add_review",

        place_id:
          currentPlace.id,

        author_name:
          name,

        rating:
          selectedRating,

        review_text:
          text
      }
    );


    document
      .getElementById(
        "reviewName"
      )
      .value = "";


    document
      .getElementById(
        "reviewText"
      )
      .value = "";


    selectedRating =
      0;


    document
      .querySelectorAll(
        "#starSelect button"
      )
      .forEach(
        button=>{

          button.textContent =
            "☆";

          button.classList.remove(
            "active"
          );

        }
      );


    alert(
      "Дякуємо за відгук!"
    );


    await loadPlaces();


    const updated =
      places.find(
        item =>
          String(
            item.id
          ) ===
          String(
            currentPlace.id
          )
      );


    if(updated){

      await openPlace(
        updated
      );

    }


  }catch(error){

    alert(
      "❌ " +
      error.message
    );

  }

}
